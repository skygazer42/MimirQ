name: SonarCloud

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: [self-hosted, linux, x64, mimirq-sonar]
    timeout-minutes: 20
    steps:
      - name: Checkout local repository
        run: |
          set -euo pipefail

          workspace="$GITHUB_WORKSPACE"
          cd "$(dirname "$workspace")"
          rm -rf "$workspace"
          git -C /data/temp34/MimirQ worktree prune
          git -C /data/temp34/MimirQ worktree add --detach "$workspace" "$GITHUB_SHA"
          cd "$workspace"

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Local checkout $actual_sha does not match workflow SHA $GITHUB_SHA"
            exit 1
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
