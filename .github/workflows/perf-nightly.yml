name: Perf Nightly

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily (11:00 Asia/Shanghai)
    - cron: "0 3 * * *"

concurrency:
  group: perf-nightly
  cancel-in-progress: true

jobs:
  perf-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Start retrieval-dev stack
        run: |
          docker compose -f docker/docker-compose.retrieval-dev.yml up -d --build

      - name: Wait for API ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready in time"
          docker compose -f docker/docker-compose.retrieval-dev.yml ps
          docker compose -f docker/docker-compose.retrieval-dev.yml logs --tail=200 mimirq-api || true
          exit 1

      - name: Run perf suite
        run: |
          mkdir -p artifacts
          python scripts/perf/run_perf_suite.py \
            --llm-mock \
            --base-url http://localhost:8000 \
            --iterations 10 \
            --timeout-sec 2.0 \
            --out artifacts/perf_suite.current.json

      - name: Diff vs baseline (strict gate)
        run: |
          python scripts/perf/diff_perf_suite_reports.py \
            --baseline ci/perf_suite_baseline.v1.json \
            --current artifacts/perf_suite.current.json \
            --policy ci/perf_regression_policy.v1.json \
            --out artifacts/perf_suite.diff.json \
            --out-md artifacts/perf_suite.diff.md \
            --strict

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-suite
          path: |
            artifacts/perf_suite.current.json
            artifacts/perf_suite.diff.json
            artifacts/perf_suite.diff.md

      - name: Shutdown stack
        if: always()
        run: |
          docker compose -f docker/docker-compose.retrieval-dev.yml down -v
