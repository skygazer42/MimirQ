name: Lint Fast

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: /home/user/.local/share/uv/python/cpython-3.11.13-linux-x86_64-gnu/bin
  PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

jobs:
  lint-fast:
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          HTTP_PROXY: http://127.0.0.1:35983
          HTTPS_PROXY: http://127.0.0.1:35983
          ALL_PROXY: socks://127.0.0.1:35983/
          http_proxy: http://127.0.0.1:35983
          https_proxy: http://127.0.0.1:35983
          all_proxy: socks://127.0.0.1:35983/
          NO_PROXY: 127.0.0.1,localhost,ci-service.example
          no_proxy: 127.0.0.1,localhost,ci-service.example

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          VENV_DIR="$RUNNER_TEMP/mimirq-py311"
          "$SELF_HOSTED_PYTHON_BIN/python3.11" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" --version

      - name: Setup Python
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.9

      - name: Python lint
        run: python -m ruff check app tests scripts main.py

      - name: Setup pnpm
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.26.0"
          run_install: false

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Setup Node
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Web lint
        working-directory: web
        run: pnpm run lint

      - name: Web typecheck
        working-directory: web
        run: pnpm run typecheck
