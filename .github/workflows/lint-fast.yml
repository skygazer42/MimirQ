name: Lint Fast

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: /home/user/.local/share/uv/python/cpython-3.11.13-linux-x86_64-gnu/bin

jobs:
  lint-fast:
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare self-hosted Python
        if: ${{ contains(runner.labels, 'self-hosted') }}
        run: |
          echo "$SELF_HOSTED_PYTHON_BIN" >> "$GITHUB_PATH"
          "$SELF_HOSTED_PYTHON_BIN/python3.11" --version
          "$SELF_HOSTED_PYTHON_BIN/python3.11" -m pip --version

      - name: Setup Python
        if: ${{ !contains(runner.labels, 'self-hosted') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.9

      - name: Python lint
        run: python -m ruff check app tests scripts main.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.26.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Web lint
        working-directory: web
        run: pnpm run lint

      - name: Web typecheck
        working-directory: web
        run: pnpm run typecheck
