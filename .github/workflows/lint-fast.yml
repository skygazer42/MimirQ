name: Lint Fast

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install Python linter
        run: python -m pip install ruff==0.15.9

      - name: Python lint
        run: python -m ruff check app tests scripts main.py

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Web lint
        working-directory: web
        run: pnpm run lint

      - name: Web typecheck
        working-directory: web
        run: pnpm run typecheck
