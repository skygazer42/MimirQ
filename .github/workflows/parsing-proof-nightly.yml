name: Parsing Proof Nightly

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC daily (12:00 Asia/Shanghai)
    - cron: "0 4 * * *"

concurrency:
  group: parsing-proof-nightly
  cancel-in-progress: true

jobs:
  parsing-proof-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_MOCK_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 10 --timeout 120 \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Run sample broader parsing proof sweep
        run: |
          mkdir -p artifacts/parsing_proof_broader_nightly
          python scripts/run_sample_parsing_retrieval_proof.py \
            --out-dir artifacts/parsing_proof_broader_nightly

      - name: Evaluate broader parsing proof thresholds
        run: |
          python scripts/parsing_retrieval_proof_gate.py \
            --input artifacts/parsing_proof_broader_nightly/summary.json \
            --thresholds ci/parsing_retrieval_proof_thresholds.v1.json \
            --out artifacts/parsing_proof_broader_nightly/gate.json

      - name: Upload nightly parsing proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parsing-proof-nightly
          path: |
            artifacts/parsing_proof_broader_nightly/parsing_proof_batch.spec.json
            artifacts/parsing_proof_broader_nightly/*.fixture.json
            artifacts/parsing_proof_broader_nightly/*.report.json
            artifacts/parsing_proof_broader_nightly/rollout.json
            artifacts/parsing_proof_broader_nightly/summary.json
            artifacts/parsing_proof_broader_nightly/gate.json
            artifacts/parsing_proof_broader_nightly/diff.json
            artifacts/parsing_proof_broader_nightly/diff.md
