name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # weekly

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: TruffleHog
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            trufflesecurity/trufflehog@sha256:c28ab4a11e01d6fcc10776f65cce015bdf9795f2393cffa2ec0a7c8464ee58b6 \
            git file://. --branch HEAD --results=verified --fail --no-update

  dependency-audit:
    name: Dependency Audit (pip-audit, pnpm audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install pip-audit
        run: |
          # Keep aligned with repo tooling policy (see requirements.txt).
          python -m pip install pip-audit==2.10.0

      - name: Audit Python direct requirements
        run: make audit-py

      - name: Configure npm registry (audit endpoint)
        working-directory: web
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit web deps (high+)
        run: make audit-web

      - name: Install handbook deps
        working-directory: docs-site
        run: npm ci

      - name: Audit handbook deps (high+)
        run: make audit-docs
