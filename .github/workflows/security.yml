name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # weekly

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_INDEX_URL: ${{ github.event_name == 'pull_request' && 'https://pypi.org/simple' || vars.CI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
  http_proxy: ${{ github.event_name != 'pull_request' && vars.CI_HTTP_PROXY || '' }}
  https_proxy: ${{ github.event_name != 'pull_request' && vars.CI_HTTPS_PROXY || '' }}
  no_proxy: ${{ github.event_name != 'pull_request' && vars.CI_NO_PROXY != '' && format('127.0.0.1,localhost,{0}', vars.CI_NO_PROXY) || '127.0.0.1,localhost' }}

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'mimirq' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: TruffleHog
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            trufflesecurity/trufflehog@sha256:c28ab4a11e01d6fcc10776f65cce015bdf9795f2393cffa2ec0a7c8464ee58b6 \
            git file://. --branch HEAD --results=verified --fail --no-update

  dependency-audit:
    name: Dependency Audit (pip-audit, pnpm audit, npm audit)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'mimirq' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install pip-audit
        run: |
          # Keep aligned with repo tooling policy (see requirements.txt).
          python -m pip install pip-audit==2.10.0

      - name: Audit Python direct requirements
        run: make audit-py

      - name: Configure npm registry (audit endpoint)
        working-directory: web
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit web deps (high+)
        run: make audit-web

      - name: Install handbook deps
        working-directory: docs-site
        run: npm ci

      - name: Audit handbook deps (high+)
        run: make audit-docs
