name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # weekly

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: /home/user/.local/share/uv/python/cpython-3.11.13-linux-x86_64-gnu/bin
  PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
  SELF_HOSTED_HTTP_PROXY: http://127.0.0.1:35983
  SELF_HOSTED_HTTPS_PROXY: http://127.0.0.1:35983
  SELF_HOSTED_ALL_PROXY: socks://127.0.0.1:35983/
  SELF_HOSTED_NO_PROXY: 127.0.0.1,localhost,ci-service.example

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scan the checked-out snapshot / shallow history to keep signal on
          # the changes under review instead of historical credentials that are
          # outside the current remediation scope.
          fetch-depth: 1
        env:
          HTTP_PROXY: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          HTTPS_PROXY: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          ALL_PROXY: ${{ env.SELF_HOSTED_ALL_PROXY }}
          http_proxy: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          https_proxy: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          all_proxy: ${{ env.SELF_HOSTED_ALL_PROXY }}
          NO_PROXY: ${{ env.SELF_HOSTED_NO_PROXY }}
          no_proxy: ${{ env.SELF_HOSTED_NO_PROXY }}

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ef6e76c3c4023279497fab4721ffa071a722fd05
        with:
          # Keep signal high: fail only on verified credentials.
          extra_args: --results=verified
          version: "3.92.4"

  dependency-audit:
    name: Dependency Audit (pip-audit, pnpm audit)
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          HTTP_PROXY: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          HTTPS_PROXY: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          ALL_PROXY: ${{ env.SELF_HOSTED_ALL_PROXY }}
          http_proxy: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          https_proxy: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          all_proxy: ${{ env.SELF_HOSTED_ALL_PROXY }}
          NO_PROXY: ${{ env.SELF_HOSTED_NO_PROXY }}
          no_proxy: ${{ env.SELF_HOSTED_NO_PROXY }}

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          VENV_DIR="$RUNNER_TEMP/mimirq-py311"
          "$SELF_HOSTED_PYTHON_BIN/python3.11" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" --version

      - name: Setup Python
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          # Keep aligned with repo tooling policy (see requirements.txt).
          python -m pip install pip-audit==2.10.0

      - name: Audit Python direct requirements
        run: |
          pip-audit -r requirements.txt --no-deps --disable-pip \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln GHSA-rrmf-rvhw-rf47 \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c \
            --ignore-vuln GHSA-95ww-475f-pr4f

      - name: Setup pnpm
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.26.0"
          run_install: false

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Setup Node
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Configure npm registry (audit endpoint)
        working-directory: web
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit web prod deps (high+)
        working-directory: web
        run: pnpm audit --prod --audit-level high
