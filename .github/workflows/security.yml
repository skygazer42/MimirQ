name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.92.4
        with:
          # Keep signal high: fail only on verified credentials.
          extra_args: --results=verified
          version: "3.92.4"

  dependency-audit:
    name: Dependency Audit (pip-audit, pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          # Keep aligned with repo tooling policy (see requirements.txt).
          python -m pip install pip-audit==2.10.0

      - name: Audit Python direct requirements
        run: pip-audit -r requirements.txt --no-deps --disable-pip --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Configure npm registry (audit endpoint)
        working-directory: web
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit web prod deps (high+)
        working-directory: web
        run: pnpm audit --prod --audit-level high
