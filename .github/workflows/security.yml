name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # weekly

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: TruffleHog
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            trufflesecurity/trufflehog:3.92.4 \
            git file://. --branch HEAD --results=verified --fail --no-update

  dependency-audit:
    name: Dependency Audit (pip-audit, pnpm audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install pip-audit
        run: |
          # Keep aligned with repo tooling policy (see requirements.txt).
          python -m pip install pip-audit==2.10.0

      - name: Audit Python direct requirements
        run: |
          pip-audit -r requirements.txt --no-deps --disable-pip \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln GHSA-rrmf-rvhw-rf47 \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c \
            --ignore-vuln GHSA-95ww-475f-pr4f

      - name: Configure npm registry (audit endpoint)
        working-directory: web
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit web deps (high+)
        working-directory: web
        run: pnpm audit --audit-level high

      - name: Install handbook deps
        working-directory: docs-site
        run: npm ci

      - name: Audit handbook deps (high+)
        working-directory: docs-site
        run: npm audit --audit-level=high
