name: Handbook (Docusaurus) verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install & build handbook
        run: |
          cd docs-site
          npm ci
          npm run build

      - name: Check relative links in handbook sources
        run: node scripts/docs/check_doc_links.mjs
