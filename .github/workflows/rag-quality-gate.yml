name: RAG Quality Gate

on:
  pull_request:
    paths:
      - "app/rag/**"
      - "app/core/config.py"
      - "scripts/run_sample_retrieval_benchmark.py"
      - "scripts/build_rag_quality_gate_artifacts.py"
      - "data/sample/retrieval_fixture_v1.json"
      - "tests/rag/evaluation/**"
      - ".github/workflows/rag-quality-gate.yml"
  workflow_dispatch:

jobs:
  rag-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAG_EVAL_GATE_ENABLED: "true"
      RAG_EVAL_GATE_SUMMARY_PATH: "artifacts/answer_quality.summary.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt

      - name: Generate bounded retrieval benchmark
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_v1.json \
            --out artifacts/sample_retrieval_bench.json \
            --retrieval-mode keyword \
            --top-k 5

      - name: Build RAG quality gate artifacts
        run: |
          python scripts/build_rag_quality_gate_artifacts.py \
            --benchmark artifacts/sample_retrieval_bench.json \
            --summary-out artifacts/answer_quality.summary.json \
            --report-out artifacts/rag_quality_gate.report.json

      - name: Run RAG quality gate test
        run: pytest -q tests/rag/evaluation/test_rag_quality_gate.py --junitxml=artifacts/rag_quality_gate.junit.xml

      - name: Upload RAG quality gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-quality-gate
          path: |
            artifacts/sample_retrieval_bench.json
            artifacts/answer_quality.summary.json
            artifacts/rag_quality_gate.report.json
            artifacts/rag_quality_gate.junit.xml
