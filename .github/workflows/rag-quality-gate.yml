name: RAG Quality Gate

on:
  workflow_dispatch:

jobs:
  rag-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAG_EVAL_GATE_ENABLED: "true"
      RAG_EVAL_GATE_SUMMARY_PATH: "artifacts/answer_quality.summary.json"
      # Keep these canonical paths duplicated in the workflow so the regression
      # test can assert the quality-gate inputs/outputs stay wired together:
      # - scripts/run_sample_retrieval_benchmark.py
      # - scripts/build_rag_quality_gate_artifacts.py
      # - data/sample/retrieval_fixture_v1.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 10 --timeout 120 \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      - name: Generate bounded retrieval benchmark via scripts/run_sample_retrieval_benchmark.py using data/sample/retrieval_fixture_v1.json
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_v1.json \
            --out artifacts/sample_retrieval_bench.json \
            --retrieval-mode keyword \
            --top-k 5

      - name: Build RAG quality gate artifacts via scripts/build_rag_quality_gate_artifacts.py
        run: |
          python scripts/build_rag_quality_gate_artifacts.py \
            --benchmark artifacts/sample_retrieval_bench.json \
            --summary-out artifacts/answer_quality.summary.json \
            --report-out artifacts/rag_quality_gate.report.json

      - name: Run sample broader parsing proof sweep
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts/parsing_proof_broader_sample
          python scripts/run_sample_parsing_retrieval_proof.py \
            --out-dir artifacts/parsing_proof_broader_sample

      - name: Evaluate broader parsing proof thresholds
        run: |
          python scripts/parsing_retrieval_proof_gate.py \
            --input artifacts/parsing_proof_broader_sample/summary.json \
            --thresholds ci/parsing_retrieval_proof_thresholds.v1.json \
            --out artifacts/parsing_proof_broader_sample/gate.json

      - name: Run RAG quality gate test
        run: pytest -q tests/rag/evaluation/test_rag_quality_gate.py --junitxml=artifacts/rag_quality_gate.junit.xml

      - name: Upload RAG quality gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rag-quality-gate
          path: |
            artifacts/sample_retrieval_bench.json
            artifacts/answer_quality.summary.json
            artifacts/rag_quality_gate.report.json
            artifacts/rag_quality_gate.junit.xml
            artifacts/parsing_proof_broader_sample/parsing_proof_batch.spec.json
            artifacts/parsing_proof_broader_sample/*.fixture.json
            artifacts/parsing_proof_broader_sample/*.report.json
            artifacts/parsing_proof_broader_sample/rollout.json
            artifacts/parsing_proof_broader_sample/summary.json
            artifacts/parsing_proof_broader_sample/gate.json
            artifacts/parsing_proof_broader_sample/diff.json
            artifacts/parsing_proof_broader_sample/diff.md
            artifacts/parsing_proof_broader_sample/review.md
