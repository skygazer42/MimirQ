name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: ${{ vars.CI_SELF_HOSTED_PYTHON_BIN || '' }}
  SELF_HOSTED_VENV_DIR: ${{ vars.CI_SELF_HOSTED_VENV_DIR || '' }}
  PIP_INDEX_URL: ${{ vars.CI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
  PIP_CACHE_DIR: ${{ vars.CI_PIP_CACHE_DIR || '' }}
  TORCH_WHEEL_DIR: ${{ vars.CI_TORCH_WHEEL_DIR || '' }}
  SELF_HOSTED_HTTP_PROXY: ${{ vars.CI_HTTP_PROXY || '' }}
  SELF_HOSTED_HTTPS_PROXY: ${{ vars.CI_HTTPS_PROXY || '' }}
  SELF_HOSTED_NO_PROXY: ${{ vars.CI_NO_PROXY || '' }}

jobs:
  public-pr-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_CACHE_DIR: /home/runner/.cache/pip
      TORCH_WHEEL_DIR: /home/runner/.cache/torch-wheels
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mimirq_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d mimirq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache torch CPU wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/torch-wheels
          key: torch-wheels-${{ runner.os }}-py311-${{ hashFiles('ci/download_verified_wheels.py') }}

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR" "$TORCH_WHEEL_DIR"
          python -m pip install --upgrade pip
          python ci/download_verified_wheels.py --cache-dir "$TORCH_WHEEL_DIR"
          python -m pip install --retries 5 --timeout 120 \
            "$TORCH_WHEEL_DIR/torch-2.13.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "$TORCH_WHEEL_DIR/torchvision-0.28.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --retries 10 --timeout 120 -r requirements-dev.txt

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: OpenAPI types check
        run: make openapi-check

      - name: Prepare CI env file
        run: cp .env.example .env

      - name: Validate Docker Compose manifests
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml config --quiet
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.web.yml config --quiet
          docker compose -f docker/docker-compose.retrieval-dev.yml config --quiet

      - name: Validate Helm chart
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 lint deploy/helm/mimirq
          docker run --rm -v "$PWD:/work" -w /work alpine/helm@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 template mimirq deploy/helm/mimirq >/dev/null
          for values in deploy/helm/mimirq/examples/*.yaml; do
            docker run --rm -v "$PWD:/work" -w /work alpine/helm@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
              template mimirq deploy/helm/mimirq -f "$values" >/dev/null
          done

      - name: Backend tests
        env:
          LLM_MOCK_ENABLED: "true"
          LLM_API_KEY: "sk-test"
          OPENAI_API_KEY: "sk-test"
        run: make test

      - name: PR deterministic retrieval-ranking proxy gate
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_hybrid_v1.json \
            --out artifacts/sample_retrieval_bench.json \
            --retrieval-mode hybrid \
            --top-k 5
          python scripts/build_rag_quality_gate_artifacts.py \
            --benchmark artifacts/sample_retrieval_bench.json \
            --summary-out artifacts/retrieval_ranking_proxy.summary.json \
            --report-out artifacts/retrieval_ranking_proxy_gate.report.json
          python -m pytest -q tests/rag/evaluation/test_rag_quality_gate.py

      - name: Database migrations and integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mimirq_ci
          SECRET_KEY: ci-db-upgrade-secret-key-0123456789
          MIMIRQ_DB_CREATE_ALL_ON_STARTUP: "false"
          MIMIRQ_DB_RUNTIME_MIGRATIONS_ENABLED: "false"
          MIMIRQ_INTEGRATION_TESTS: "1"
        run: |
          make db-upgrade
          python -m pytest -q \
            tests/test_alembic_upgrade_from_prior_revision.py \
            tests/test_core_schema_integration.py \
            tests/test_document_version_diff_integration.py \
            tests/test_document_versions_integration.py

      - name: PR hosted live core gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mimirq_ci
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
          MIMIRQ_DB_CREATE_ALL_ON_STARTUP: "false"
          MIMIRQ_DB_RUNTIME_MIGRATIONS_ENABLED: "false"
        run: bash scripts/run_ci_live_core_gate.sh artifacts/live-core-release-gate.pr.json

      - name: Upload PR live core gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-pr-live-core-gate
          path: |
            artifacts/live-core-release-gate.pr.json
            artifacts/live-core-primary.log
            artifacts/live-core-secondary.log
          if-no-files-found: error

      - name: Frontend verify
        run: make verify

      - name: Frontend tests
        run: make test-web

      - name: Frontend build
        working-directory: web
        run: pnpm run build

      - name: Install Playwright browsers for PR browser smoke
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: PR hosted browser smoke
        working-directory: web
        env:
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: pnpm exec playwright test e2e/document-chat.smoke.spec.ts

  test-and-verify:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mimirq_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d mimirq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
        env:
          http_proxy: ${{ vars.CI_HTTP_PROXY || '' }}
          https_proxy: ${{ vars.CI_HTTPS_PROXY || '' }}
          no_proxy: ${{ vars.CI_NO_PROXY != '' && format('127.0.0.1,localhost,{0}', vars.CI_NO_PROXY) || '127.0.0.1,localhost' }}

      - name: Ensure self-hosted toolchain
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          bash scripts/prepare_self_hosted_ci.sh --include-torch-wheel-dir
          command -v rg
          rg --version | head -n 1

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR" "$TORCH_WHEEL_DIR"
          python -m pip install --upgrade pip
          python ci/download_verified_wheels.py --cache-dir "$TORCH_WHEEL_DIR"
          python -m pip install --retries 5 --timeout 120 \
            "$TORCH_WHEEL_DIR/torch-2.13.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "$TORCH_WHEEL_DIR/torchvision-0.28.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --retries 10 --timeout 120 -r requirements-dev.txt

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: OpenAPI types check
        run: make openapi-check

      - name: API types drift gate
        working-directory: web
        run: node scripts/check-api-types-drift.mjs --strict --baseline scripts/api-types-drift-baseline.json

      - name: Backend tests
        env:
          LLM_MOCK_ENABLED: "true"
          LLM_API_KEY: "sk-test"
          OPENAI_API_KEY: "sk-test"
        run: make test

      - name: Database migrations and integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mimirq_ci
          SECRET_KEY: ci-db-upgrade-secret-key-0123456789
          MIMIRQ_DB_CREATE_ALL_ON_STARTUP: "false"
          MIMIRQ_DB_RUNTIME_MIGRATIONS_ENABLED: "false"
          MIMIRQ_INTEGRATION_TESTS: "1"
        run: |
          make db-upgrade
          python -m pytest -q \
            tests/test_alembic_upgrade_from_prior_revision.py \
            tests/test_core_schema_integration.py \
            tests/test_document_version_diff_integration.py \
            tests/test_document_versions_integration.py

      - name: Generate full-stack test inventory
        run: make test-matrix

      - name: Repo verify
        run: make verify

      - name: Upload full-stack test inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-stack-test-inventory
          path: |
            artifacts/test-coverage-matrix.json
            artifacts/test-coverage-matrix.md
          if-no-files-found: error

  web-test-and-verify:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
        env:
          http_proxy: ${{ vars.CI_HTTP_PROXY || '' }}
          https_proxy: ${{ vars.CI_HTTPS_PROXY || '' }}
          no_proxy: ${{ vars.CI_NO_PROXY != '' && format('127.0.0.1,localhost,{0}', vars.CI_NO_PROXY) || '127.0.0.1,localhost' }}

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: make test-web

      - name: Critical frontend coverage
        working-directory: web
        run: pnpm run test:coverage:critical

      - name: Install Playwright browsers
        if: ${{ runner.environment == 'self-hosted' }}
        working-directory: web
        run: pnpm exec playwright install chromium

      - name: Browser smoke suite
        run: make test-web-e2e

  docker-build:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
        env:
          http_proxy: ${{ vars.CI_HTTP_PROXY || '' }}
          https_proxy: ${{ vars.CI_HTTPS_PROXY || '' }}
          no_proxy: ${{ vars.CI_NO_PROXY != '' && format('127.0.0.1,localhost,{0}', vars.CI_NO_PROXY) || '127.0.0.1,localhost' }}

      - name: Prepare self-hosted Node
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Prepare Docker build proxy
        run: |
          {
            printf 'HTTP_PROXY=%s\n' "${SELF_HOSTED_HTTP_PROXY:-${HTTP_PROXY:-}}"
            printf 'HTTPS_PROXY=%s\n' "${SELF_HOSTED_HTTPS_PROXY:-${HTTPS_PROXY:-}}"
            printf 'http_proxy=%s\n' "${SELF_HOSTED_HTTP_PROXY:-${http_proxy:-}}"
            printf 'https_proxy=%s\n' "${SELF_HOSTED_HTTPS_PROXY:-${https_proxy:-}}"
            printf 'NO_PROXY=%s\n' "127.0.0.1,localhost${SELF_HOSTED_NO_PROXY:+,$SELF_HOSTED_NO_PROXY}"
            printf 'no_proxy=%s\n' "127.0.0.1,localhost${SELF_HOSTED_NO_PROXY:+,$SELF_HOSTED_NO_PROXY}"
            printf 'DOCKER_BUILD_NETWORK=host\n'
          } >> "$GITHUB_ENV"
          python scripts/select_free_docker_subnet.py --seed "$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Validate Helm chart
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 lint deploy/helm/mimirq
          docker run --rm -v "$PWD:/work" -w /work alpine/helm@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 template mimirq deploy/helm/mimirq >/dev/null
          for values in deploy/helm/mimirq/examples/*.yaml; do
            docker run --rm -v "$PWD:/work" -w /work alpine/helm@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
              template mimirq deploy/helm/mimirq -f "$values" >/dev/null
          done

      - name: Build backend image
        run: |
          docker build --network host \
            --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY \
            -t mimirq-backend -f docker/Dockerfile .

      - name: Build web image
        run: |
          docker build --network host \
            --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY \
            --build-arg NEXT_PUBLIC_API_URL=/ \
            -t mimirq-web -f web/Dockerfile.prod web

      - name: Install JWT browser smoke dependencies
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: README docker quickstart smoke
        env:
          API_HEALTHCHECK_START_PERIOD: "420s"
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-readme-${{ github.run_id }}-${{ github.run_attempt }}
          MARKDOWN_IMAGE_PROXY_SECRET: ci-markdown-image-proxy-secret
          WEB_PORT: "0"
        run: |
          mkdir -p artifacts
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.web.yml)
          make up-web
          api_port=$("${compose[@]}" port mimirq-api 8000 | head -n 1 | sed 's/.*://')
          [[ "$api_port" =~ ^[0-9]+$ ]]
          make core-e2e \
            CORE_E2E_BASE_URL=http://127.0.0.1:$api_port \
            CORE_E2E_BOOTSTRAP_REGISTER=1 \
            CORE_E2E_OUT=artifacts/core-e2e.readme-docker.json

      - name: Clean up README docker quickstart stack
        if: always()
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-readme-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_PORT: "0"
        run: docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.web.yml down -v --remove-orphans

      - name: README lite quickstart smoke
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-lite-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p artifacts
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file .env -f docker/docker-compose.lite.yml)
          make up-lite
          api_port=$("${compose[@]}" port mimirq-api 8000 | head -n 1 | sed 's/.*://')
          [[ "$api_port" =~ ^[0-9]+$ ]]
          for i in $(seq 1 60); do
            if curl --noproxy '*' -fsS http://127.0.0.1:$api_port/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              "${compose[@]}" ps
              "${compose[@]}" logs --tail=200 mimirq-api mimirq-worker mimirq-postgres mimirq-redis
              exit 1
            fi
            sleep 5
          done
          make core-e2e \
            CORE_E2E_BASE_URL=http://127.0.0.1:$api_port \
            CORE_E2E_BOOTSTRAP_REGISTER=1 \
            CORE_E2E_OUT=artifacts/core-e2e.readme-lite.json

      - name: Clean up README lite quickstart stack
        if: always()
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-lite-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose --env-file .env -f docker/docker-compose.lite.yml down -v --remove-orphans

      - name: Smoke built backend and web images
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MARKDOWN_IMAGE_PROXY_SECRET: ci-markdown-image-proxy-secret
          MIMIRQ_BACKEND_IMAGE: mimirq-backend
        run: |
          compose=(docker compose -f docker/docker-compose.retrieval-dev.yml)
          if ! "${compose[@]}" up -d --no-build --wait --wait-timeout 300; then
            "${compose[@]}" ps
            "${compose[@]}" logs --tail=200 mimirq-api
            exit 1
          fi

          web_name="mimirq-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$web_name" \
            -p 127.0.0.1::3000 \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -e HOST=0.0.0.0 \
            -e API_INTERNAL_URL=http://mimirq-api:8000 \
            -e MARKDOWN_IMAGE_PROXY_SECRET \
            mimirq-web
          for _ in {1..30}; do
            if docker exec "$web_name" wget -Y off -qO- http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$web_name"
          exit 1

      - name: JWT built-web browser smoke
        env:
          MIMIRQ_WEB_CONTAINER: mimirq-web-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/run_ci_jwt_browser_smoke.sh

      - name: Docker web-proxy and dual-api core smoke
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MIMIRQ_BACKEND_IMAGE: mimirq-backend
        run: |
          mkdir -p artifacts
          api2_name="mimirq-api-secondary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$api2_name" >/dev/null 2>&1 || true' EXIT
          docker compose -f docker/docker-compose.retrieval-dev.yml run -d \
            --name "$api2_name" --no-deps mimirq-api
          docker compose -f docker/docker-compose.retrieval-dev.yml run --rm --no-deps -T \
            -e MIMIRQ_SMOKE_IDENTIFIER \
            -e MIMIRQ_SMOKE_PASSWORD \
            -v "$PWD:/work" -w /work mimirq-api \
            python scripts/smoke_test.py \
              --base-url http://mimirq-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:3000 \
              --web-base-url http://mimirq-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:3000 \
              --secondary-base-url http://$api2_name:8000 \
              --core-only \
              --out artifacts/core-e2e.web-dual-api.json

      - name: Clean up image smoke stack
        if: always()
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MIMIRQ_BACKEND_IMAGE: mimirq-backend
        run: |
          docker rm -f "mimirq-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          docker compose -f docker/docker-compose.retrieval-dev.yml down -v --remove-orphans

      - name: Docker live core release gate
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-ci-live-${{ github.run_id }}-${{ github.run_attempt }}
          MIMIRQ_BACKEND_IMAGE: mimirq-backend
          AUTH_MODE_RETRIEVAL_DEV: header
          UPLOAD_DEDUP_ENABLED_RETRIEVAL_DEV: "true"
          RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_ENABLED_RETRIEVAL_DEV: "true"
          RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_MAX_CONCURRENCY_RETRIEVAL_DEV: "3"
          RAG_RETRIEVAL_OFFLOAD_MAX_CONCURRENCY_RETRIEVAL_DEV: "3"
          DATASET_ANALYSIS_PNG_STALE_AFTER_SEC_RETRIEVAL_DEV: "2"
        run: |
          mkdir -p artifacts
          compose=(docker compose -f docker/docker-compose.retrieval-dev.yml)
          api2_name="mimirq-api-live-secondary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$api2_name" >/dev/null 2>&1 || true' EXIT
          if ! "${compose[@]}" up -d --no-build --wait --wait-timeout 300; then
            "${compose[@]}" ps
            "${compose[@]}" logs --tail=200 mimirq-api
            exit 1
          fi
          docker compose -f docker/docker-compose.retrieval-dev.yml run -d \
            --name "$api2_name" --no-deps mimirq-api
          "${compose[@]}" run --rm --no-deps -T \
            -v "$PWD:/work" -w /work mimirq-api \
            python scripts/live_core_release_gate.py \
              --base-url http://mimirq-api:8000 \
              --secondary-base-url http://$api2_name:8000 \
              --tenant-id 11111111-1111-1111-1111-111111111111 \
              --secondary-tenant-id 22222222-2222-2222-2222-222222222222 \
              --user-id ci-live-gate \
              --out artifacts/live-core-release-gate.docker.json

      - name: Clean up live core release gate stack
        if: always()
        env:
          BACKEND_PORT: "0"
          COMPOSE_PROJECT_NAME: mimirq-ci-live-${{ github.run_id }}-${{ github.run_attempt }}
          MIMIRQ_BACKEND_IMAGE: mimirq-backend
          AUTH_MODE_RETRIEVAL_DEV: header
          UPLOAD_DEDUP_ENABLED_RETRIEVAL_DEV: "true"
          RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_ENABLED_RETRIEVAL_DEV: "true"
          RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_MAX_CONCURRENCY_RETRIEVAL_DEV: "3"
          RAG_RETRIEVAL_OFFLOAD_MAX_CONCURRENCY_RETRIEVAL_DEV: "3"
          DATASET_ANALYSIS_PNG_STALE_AFTER_SEC_RETRIEVAL_DEV: "2"
        run: docker compose -f docker/docker-compose.retrieval-dev.yml down -v --remove-orphans

  retrieval-only-bounded-gate:
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 60
    env:
      ENV: ci
      AUTH_MODE: header
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
        env:
          http_proxy: ${{ vars.CI_HTTP_PROXY || '' }}
          https_proxy: ${{ vars.CI_HTTPS_PROXY || '' }}
          no_proxy: ${{ vars.CI_NO_PROXY != '' && format('127.0.0.1,localhost,{0}', vars.CI_NO_PROXY) || '127.0.0.1,localhost' }}

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' }}
        run: bash scripts/prepare_self_hosted_ci.sh --include-torch-wheel-dir

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR" "$TORCH_WHEEL_DIR"
          python -m pip install --upgrade pip
          python ci/download_verified_wheels.py --cache-dir "$TORCH_WHEEL_DIR"
          python -m pip install --retries 5 --timeout 120 \
            "$TORCH_WHEEL_DIR/torch-2.13.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "$TORCH_WHEEL_DIR/torchvision-0.28.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --retries 10 --timeout 120 -r requirements.txt

      - name: Validate query-set health policy config
        run: |
          mkdir -p artifacts
          python scripts/validate_queryset_health_policy.py \
            --policy ci/queryset_health_policy.v1.json \
            --out artifacts/queryset_health_policy.normalized.json

      - name: Run deterministic sample retrieval benchmark
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_v1.json \
            --out artifacts/sample_retrieval_bench.json \
            --retrieval-mode keyword \
            --top-k 5

      - name: Run deterministic sample retrieval benchmark (hybrid bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_hybrid_v1.json \
            --out artifacts/sample_retrieval_bench.hybrid.json \
            --retrieval-mode hybrid \
            --top-k 5

      - name: Run deterministic sample retrieval benchmark (sparse bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_sparse_v1.json \
            --out artifacts/sample_retrieval_bench.sparse.json \
            --retrieval-mode keyword \
            --top-k 5 \
            --enable-sparse-retrieval \
            --sparse-retrieval-provider deterministic

      - name: Run deterministic sample retrieval benchmark (colbert bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_colbert_v1.json \
            --out artifacts/sample_retrieval_bench.colbert.json \
            --retrieval-mode vector \
            --top-k 5 \
            --enable-colbert-retrieval \
            --colbert-retrieval-provider deterministic

      - name: Run sample broader parsing proof sweep
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts/parsing_proof_broader_sample
          python scripts/run_sample_parsing_retrieval_proof.py \
            --out-dir artifacts/parsing_proof_broader_sample

      - name: Evaluate broader parsing proof thresholds
        run: |
          python scripts/parsing_retrieval_proof_gate.py \
            --input artifacts/parsing_proof_broader_sample/summary.json \
            --thresholds ci/parsing_retrieval_proof_thresholds.v1.json \
            --out artifacts/parsing_proof_broader_sample/gate.json

      - name: Build broader parsing proof diff artifacts
        run: |
          python scripts/diff_parsing_retrieval_proof_summaries.py \
            --a ci/parsing_retrieval_proof_summary_baseline.v1.json \
            --b artifacts/parsing_proof_broader_sample/summary.json \
            --out artifacts/parsing_proof_broader_sample/diff.json \
            --out-md artifacts/parsing_proof_broader_sample/diff.md

      - name: Build query-set health snapshot from bounded benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.json \
            --out artifacts/queryset_health.snapshot.json \
            --history artifacts/queryset_health.history.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.json

      - name: Build query-set health snapshot from bounded hybrid benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.hybrid.json \
            --out artifacts/queryset_health.snapshot.hybrid.json \
            --history artifacts/queryset_health.history.hybrid.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.hybrid.json

      - name: Build query-set health snapshot from bounded sparse benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.sparse.json \
            --out artifacts/queryset_health.snapshot.sparse.json \
            --history artifacts/queryset_health.history.sparse.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.sparse.json

      - name: Build query-set health diff artifacts
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.json \
            --out artifacts/queryset_health.diff.json \
            --out-md artifacts/queryset_health.diff.md

      - name: Build query-set health diff artifacts (hybrid)
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_hybrid_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.hybrid.json \
            --out artifacts/queryset_health.diff.hybrid.json \
            --out-md artifacts/queryset_health.diff.hybrid.md

      - name: Build query-set health diff artifacts (sparse)
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_sparse_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.sparse.json \
            --out artifacts/queryset_health.diff.sparse.json \
            --out-md artifacts/queryset_health.diff.sparse.md

      - name: Run parse_bench strict gate (docs slice)
        run: |
          mkdir -p artifacts
          python -m app.rag.evaluation.parse_bench run \
            --input-dir tests/fixtures/parsing_golden \
            --manifest tests/fixtures/parsing_golden/manifest.json \
            --parsers basic \
            --max-files 8 \
            --out artifacts/parser_benchmark.current.json \
            --baseline ci/parser_benchmark_baseline.v1.json \
            --strict-profile ci/parser_strict_profile.v1.json \
            --strict

      - name: Build parser benchmark diff artifact
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          report_path = Path("artifacts/parser_benchmark.current.json")
          out_path = Path("artifacts/parser_benchmark.diff.json")
          out_md = Path("artifacts/parser_benchmark.diff.md")

          if not report_path.exists():
              out_path.write_text(json.dumps({"missing_report": True}, ensure_ascii=False, indent=2), encoding="utf-8")
              out_md.write_text("# Parser Benchmark Diff\n\nreport missing\n", encoding="utf-8")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          payload = {
              "schema": "mimirq.parser_benchmark_diff.v1",
              "baseline": report.get("baseline"),
              "strict_gate": report.get("strict_gate"),
              "regressions": report.get("regressions"),
              "regression_severity": report.get("regression_severity"),
              "summary": report.get("summary"),
          }
          out_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          strict_gate = payload.get("strict_gate") if isinstance(payload.get("strict_gate"), dict) else {}
          regressions = payload.get("regressions") if isinstance(payload.get("regressions"), dict) else {}
          severity = payload.get("regression_severity") if isinstance(payload.get("regression_severity"), dict) else {}
          levels = severity.get("levels") if isinstance(severity.get("levels"), dict) else {}
          lines = [
              "# Parser Benchmark Diff",
              "",
              f"- Strict Gate Passed: `{bool(strict_gate.get('passed'))}`",
              f"- Baseline: `{payload.get('baseline')}`",
              f"- Changed Backends: `{len(list((regressions.get('by_backend') or {}).keys()))}`",
              f"- Severity Critical: `{int(levels.get('critical', 0) or 0)}`",
              f"- Severity High: `{int(levels.get('high', 0) or 0)}`",
          ]
          out_md.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate adaptive router policy artifact
        if: always()
        run: |
          python scripts/generate_adaptive_router_policy.py \
            --benchmark-report artifacts/sample_retrieval_bench.json \
            --out artifacts/adaptive_router_policy.v1.json

      - name: Generate channel budget policy artifact
        if: always()
