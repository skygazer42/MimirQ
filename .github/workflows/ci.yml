          bench_path = Path("artifacts/sample_retrieval_bench.hybrid.json")
          report = json.loads(bench_path.read_text(encoding="utf-8")) if bench_path.exists() else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          payload = {
