              },
          }
          out = Path("artifacts/multihop_diagnostics.summary.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Evaluate bounded retrieval-only gate (metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate] PASS")
          PY

