name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.26.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements-dev.txt

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: OpenAPI types check
        run: make openapi-check

      - name: Backend tests
        env:
          LLM_MOCK_ENABLED: "true"
          LLM_API_KEY: "sk-test"
          OPENAI_API_KEY: "sk-test"
        run: make test

      - name: Frontend tests
        run: make test-web

      - name: Generate full-stack test coverage matrix
        run: make test-matrix

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Management surface smoke
        run: make test-management-smoke

      - name: Repo verify
        run: make verify

      - name: Upload test coverage matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-matrix
          path: |
            artifacts/test-coverage-matrix.json
            artifacts/test-coverage-matrix.md

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-management-smoke-report
          path: |
            web/playwright-report
            web/test-results/playwright
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mimirq-backend -f docker/Dockerfile .

      - name: Build web image
        run: docker build -t mimirq-web -f web/Dockerfile.prod web

  retrieval-only-bounded-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt

      - name: Validate query-set health policy config
        run: |
          mkdir -p artifacts
          python scripts/validate_queryset_health_policy.py \
            --policy ci/queryset_health_policy.v1.json \
            --out artifacts/queryset_health_policy.normalized.json

      - name: Run deterministic sample retrieval benchmark
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_v1.json \
            --out artifacts/sample_retrieval_bench.json \
            --retrieval-mode keyword \
            --top-k 5

      - name: Run deterministic sample retrieval benchmark (hybrid bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_hybrid_v1.json \
            --out artifacts/sample_retrieval_bench.hybrid.json \
            --retrieval-mode hybrid \
            --top-k 5

      - name: Run deterministic sample retrieval benchmark (sparse bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_sparse_v1.json \
            --out artifacts/sample_retrieval_bench.sparse.json \
            --retrieval-mode keyword \
            --top-k 5 \
            --enable-sparse-retrieval \
            --sparse-retrieval-provider deterministic

      - name: Run deterministic sample retrieval benchmark (colbert bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_colbert_v1.json \
            --out artifacts/sample_retrieval_bench.colbert.json \
            --retrieval-mode vector \
            --top-k 5 \
            --enable-colbert-retrieval \
            --colbert-retrieval-provider deterministic

      - name: Run sample broader parsing proof sweep
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts/parsing_proof_broader_sample
          python scripts/run_sample_parsing_retrieval_proof.py \
            --out-dir artifacts/parsing_proof_broader_sample

      - name: Build broader parsing proof summary artifacts
        run: |
          python scripts/build_parsing_retrieval_proof_artifacts.py \
            --batch-report artifacts/parsing_proof_broader_sample/batch.report.json \
            --summary-out artifacts/parsing_proof_broader_sample/summary.json \
            --report-out artifacts/parsing_proof_broader_sample/report.json

      - name: Evaluate broader parsing proof thresholds (non-blocking artifact)
        run: |
          python scripts/parsing_retrieval_proof_gate.py \
            --input artifacts/parsing_proof_broader_sample/summary.json \
            --thresholds ci/parsing_retrieval_proof_thresholds.v1.json \
            --out artifacts/parsing_proof_broader_sample/gate.json || true

      - name: Build broader parsing proof diff artifacts
        run: |
          python scripts/diff_parsing_retrieval_proof_summaries.py \
            --a ci/parsing_retrieval_proof_summary_baseline.v1.json \
            --b artifacts/parsing_proof_broader_sample/summary.json \
            --out artifacts/parsing_proof_broader_sample/diff.json \
            --out-md artifacts/parsing_proof_broader_sample/diff.md

      - name: Build query-set health snapshot from bounded benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.json \
            --out artifacts/queryset_health.snapshot.json \
            --history artifacts/queryset_health.history.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.json

      - name: Build query-set health snapshot from bounded hybrid benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.hybrid.json \
            --out artifacts/queryset_health.snapshot.hybrid.json \
            --history artifacts/queryset_health.history.hybrid.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.hybrid.json

      - name: Build query-set health snapshot from bounded sparse benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.sparse.json \
            --out artifacts/queryset_health.snapshot.sparse.json \
            --history artifacts/queryset_health.history.sparse.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.sparse.json

      - name: Build query-set health diff artifacts
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.json \
            --out artifacts/queryset_health.diff.json \
            --out-md artifacts/queryset_health.diff.md

      - name: Build query-set health diff artifacts (hybrid)
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_hybrid_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.hybrid.json \
            --out artifacts/queryset_health.diff.hybrid.json \
            --out-md artifacts/queryset_health.diff.hybrid.md

      - name: Build query-set health diff artifacts (sparse)
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_sparse_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.sparse.json \
            --out artifacts/queryset_health.diff.sparse.json \
            --out-md artifacts/queryset_health.diff.sparse.md

      - name: Run parser benchmark strict gate (docs slice)
        run: |
          mkdir -p artifacts
          python scripts/parser_benchmark.py \
            --input-dir docs/guides \
            --backends basic \
            --max-files 8 \
            --out artifacts/parser_benchmark.current.json \
            --baseline ci/parser_benchmark_baseline.v1.json \
            --strict-profile ci/parser_strict_profile.v1.json \
            --strict \
            --strict-max-ok-rate-drop 1.0 \
            --strict-max-parse-score-drop 1.0 \
            --strict-max-golden-similarity-drop 1.0 \
            --strict-max-golden-coverage-drop 1.0

      - name: Build parser benchmark diff artifact
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          report_path = Path("artifacts/parser_benchmark.current.json")
          out_path = Path("artifacts/parser_benchmark.diff.json")
          out_md = Path("artifacts/parser_benchmark.diff.md")

          if not report_path.exists():
              out_path.write_text(json.dumps({"missing_report": True}, ensure_ascii=False, indent=2), encoding="utf-8")
              out_md.write_text("# Parser Benchmark Diff\n\nreport missing\n", encoding="utf-8")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          payload = {
              "schema": "mimirq.parser_benchmark_diff.v1",
              "baseline": report.get("baseline"),
              "strict_gate": report.get("strict_gate"),
              "regressions": report.get("regressions"),
              "regression_severity": report.get("regression_severity"),
              "summary": report.get("summary"),
          }
          out_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          strict_gate = payload.get("strict_gate") if isinstance(payload.get("strict_gate"), dict) else {}
          regressions = payload.get("regressions") if isinstance(payload.get("regressions"), dict) else {}
          severity = payload.get("regression_severity") if isinstance(payload.get("regression_severity"), dict) else {}
          levels = severity.get("levels") if isinstance(severity.get("levels"), dict) else {}
          lines = [
              "# Parser Benchmark Diff",
              "",
              f"- Strict Gate Passed: `{bool(strict_gate.get('passed'))}`",
              f"- Baseline: `{payload.get('baseline')}`",
              f"- Changed Backends: `{len(list((regressions.get('by_backend') or {}).keys()))}`",
              f"- Severity Critical: `{int(levels.get('critical', 0) or 0)}`",
              f"- Severity High: `{int(levels.get('high', 0) or 0)}`",
          ]
          out_md.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate adaptive router policy artifact
        if: always()
        run: |
          python scripts/generate_adaptive_router_policy.py \
            --benchmark-report artifacts/sample_retrieval_bench.json \
            --out artifacts/adaptive_router_policy.v1.json

      - name: Generate channel budget policy artifact
        if: always()
        run: |
          python scripts/generate_channel_budget_policy.py \
            --benchmark-report artifacts/sample_retrieval_bench.json \
            --hybrid-report artifacts/sample_retrieval_bench.hybrid.json \
            --sparse-report artifacts/sample_retrieval_bench.sparse.json \
            --colbert-report artifacts/sample_retrieval_bench.colbert.json \
            --out artifacts/channel_budget_policy.v1.json

      - name: Export intent router training artifact
        if: always()
        run: |
          python scripts/export_intent_router_training.py \
            --input artifacts/sample_retrieval_bench.json \
            --out artifacts/intent_router_training.v1.json

      - name: Generate intent router model artifact
        if: always()
        run: |
          python scripts/generate_intent_router_model.py \
            --input artifacts/intent_router_training.v1.json \
            --out artifacts/intent_router_model.v1.json

      - name: Build deterministic answer-quality summary artifact
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          bench = json.loads(Path("artifacts/sample_retrieval_bench.json").read_text(encoding="utf-8"))
          summary = bench.get("summary") if isinstance(bench.get("summary"), dict) else {}
          payload = {
              "schema": "mimirq.answer_quality_summary.v1",
              "summary": {
                  # Deterministic proxy metrics for retrieval-only CI path.
                  "faithfulness_det": float(summary.get("mrr") or 0.0),
                  "refusal_correctness": 1.0,
                  "abstain_rate": 0.0,
              },
          }
          out = Path("artifacts/answer_quality.summary.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Run deterministic answer-quality gate
        if: always()
        run: |
          python scripts/answer_quality_gate.py \
            --input artifacts/answer_quality.summary.json \
            --thresholds ci/answer_quality_thresholds.v1.json \
            --out artifacts/answer_quality.gate.json

      - name: Build multi-hop diagnostics summary artifact
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          bench_path = Path("artifacts/sample_retrieval_bench.hybrid.json")
          report = json.loads(bench_path.read_text(encoding="utf-8")) if bench_path.exists() else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          payload = {
              "schema": "mimirq.multihop_diagnostics_summary.v1",
              "source": str(bench_path),
              "summary": {
                  "multihop_path_completeness": summary.get("multihop_path_completeness"),
                  "multihop_order_consistency": summary.get("multihop_order_consistency"),
                  "multihop_chain_hit_rate": summary.get("multihop_chain_hit_rate"),
              },
          }
          out = Path("artifacts/multihop_diagnostics.summary.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Evaluate bounded retrieval-only gate (metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate] PASS")
          PY

      - name: Evaluate bounded retrieval-only gate (hybrid metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.hybrid.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate_hybrid") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate-hybrid] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate-hybrid] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate-hybrid] PASS")
          PY

      - name: Evaluate bounded retrieval-only gate (sparse metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.sparse.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate_sparse") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          runtime = report.get("runtime") if isinstance(report.get("runtime"), dict) else {}
          provider = str(runtime.get("sparse_retrieval_provider") or "").strip().lower()
          if not bool(runtime.get("sparse_retrieval_enabled")) or provider != "deterministic":
              print("[retrieval-only-bounded-gate-sparse] FAIL: sparse runtime metadata mismatch", file=sys.stderr)
              print(
                  f"[retrieval-only-bounded-gate-sparse] runtime={runtime}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate-sparse] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate-sparse] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate-sparse] PASS")
          PY

      - name: Evaluate bounded retrieval-only gate (colbert metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.colbert.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate_colbert") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          runtime = report.get("runtime") if isinstance(report.get("runtime"), dict) else {}
          provider = str(runtime.get("colbert_retrieval_provider") or "").strip().lower()
          if not bool(runtime.get("colbert_retrieval_enabled")) or provider != "deterministic":
              print("[retrieval-only-bounded-gate-colbert] FAIL: colbert runtime metadata mismatch", file=sys.stderr)
              print(
                  f"[retrieval-only-bounded-gate-colbert] runtime={runtime}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate-colbert] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate-colbert] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate-colbert] PASS")
          PY

      - name: Validate grounded_strict retrieval-profile contract
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from app.rag.core.retrieval_profiles import apply_retrieval_profile_overrides

          applied = apply_retrieval_profile_overrides(
              profile="grounded_strict",
              top_k=5,
              score_threshold=0.3,
              retrieval_mode="keyword",
              enable_reranker=False,
              reranker_provider="llm",
              reranker_top_n=5,
              enable_weight_rerank=True,
              retrieval_contract_mode="",
              visible_evidence_only=False,
          )

          expected = {
              "retrieval_mode": "hybrid",
              "retrieval_contract_mode": "evidence_strict",
              "visible_evidence_only": True,
              "enable_reranker": True,
              "reranker_provider": "cross_encoder",
              "enable_weight_rerank": False,
          }
          failures = []
          for key, expected_value in expected.items():
              if applied.get(key) != expected_value:
                  failures.append((key, applied.get(key), expected_value))

          if int(applied.get("top_k") or 0) < 20:
              failures.append(("top_k", applied.get("top_k"), ">=20"))
          if int(applied.get("reranker_top_n") or 0) < 20:
              failures.append(("reranker_top_n", applied.get("reranker_top_n"), ">=20"))

          out_path = Path("artifacts/retrieval_profile.grounded_strict.contract.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(
              json.dumps(
                  {
                      "schema": "mimirq.retrieval_profile_contract.v1",
                      "profile": "grounded_strict",
                      "applied": applied,
                      "failures": failures,
                  },
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              ),
              encoding="utf-8",
          )

          if failures:
              print("[retrieval-profile-grounded-strict] FAIL", file=sys.stderr)
              for key, value, expected_value in failures:
                  print(
                      f"[retrieval-profile-grounded-strict] key={key} value={value} expected={expected_value}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-profile-grounded-strict] PASS")
          PY

      - name: Validate claim verifier diagnostics contract
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from app.rag.core.claim_verifier import verify_claim

          cases = [
              {
                  "id": "supported",
                  "claim": "Sky is blue.",
                  "evidence": "The sky is blue due to Rayleigh scattering.",
                  "mode": "token_overlap",
                  "enable_contradiction_check": False,
                  "expected_supported": True,
                  "expected_reason_code": "supported",
                  "expected_contradiction_type": None,
              },
              {
                  "id": "numeric_mismatch",
                  "claim": "Revenue exceeded 100 in 2025.",
                  "evidence": "Revenue was 90 in 2025.",
                  "mode": "semantic_heuristic",
                  "enable_contradiction_check": True,
                  "expected_supported": False,
                  "expected_reason_code": "contradiction_numeric_mismatch",
                  "expected_contradiction_type": "numeric_mismatch",
              },
              {
                  "id": "negation_conflict",
                  "claim": "The policy was not active in 2020.",
                  "evidence": "The policy was active in 2020.",
                  "mode": "semantic_heuristic",
                  "enable_contradiction_check": True,
                  "expected_supported": False,
                  "expected_reason_code": "contradiction_negation_conflict",
                  "expected_contradiction_type": "negation_conflict",
              },
          ]

          failures = []
          results = []
          for case in cases:
              res = verify_claim(
                  case["claim"],
                  case["evidence"],
                  mode=case["mode"],
                  enable_contradiction_check=case["enable_contradiction_check"],
              )
              diag = dict(getattr(res, "diagnostics", {}) or {})
              results.append(
                  {
                      "id": case["id"],
                      "supported": bool(getattr(res, "supported", False)),
                      "diagnostics": diag,
                  }
              )
              if bool(getattr(res, "supported", False)) != bool(case["expected_supported"]):
                  failures.append((case["id"], "supported", getattr(res, "supported", None), case["expected_supported"]))
              if str(diag.get("reason_code") or "") != str(case["expected_reason_code"] or ""):
                  failures.append((case["id"], "reason_code", diag.get("reason_code"), case["expected_reason_code"]))
              if diag.get("contradiction_type") != case["expected_contradiction_type"]:
                  failures.append(
                      (
                          case["id"],
                          "contradiction_type",
                          diag.get("contradiction_type"),
                          case["expected_contradiction_type"],
                      )
                  )

          out_path = Path("artifacts/claim_verifier.contract.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(
              json.dumps(
                  {
                      "schema": "mimirq.claim_verifier_contract.v1",
                      "cases": results,
                      "failures": failures,
                  },
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              ),
              encoding="utf-8",
          )

          if failures:
              print("[claim-verifier-contract] FAIL", file=sys.stderr)
              for case_id, field, value, expected in failures:
                  print(
                      f"[claim-verifier-contract] case={case_id} field={field} value={value} expected={expected}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[claim-verifier-contract] PASS")
          PY

      - name: Upload bounded gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-only-bounded-gate
          path: |
            artifacts/sample_retrieval_bench.json
            artifacts/sample_retrieval_bench.hybrid.json
            artifacts/sample_retrieval_bench.sparse.json
            artifacts/sample_retrieval_bench.colbert.json
            artifacts/queryset_health_policy.normalized.json
            artifacts/queryset_health.snapshot.json
            artifacts/parsing_proof_broader_sample/rollout.json
            artifacts/parsing_proof_broader_sample/summary.json
            artifacts/parsing_proof_broader_sample/report.json
            artifacts/parsing_proof_broader_sample/gate.json
            artifacts/parsing_proof_broader_sample/diff.json
            artifacts/parsing_proof_broader_sample/diff.md
            artifacts/parsing_proof_broader_sample/review.md
            artifacts/queryset_health.snapshot.hybrid.json
            artifacts/queryset_health.snapshot.sparse.json
            artifacts/queryset_health.diff.json
            artifacts/queryset_health.diff.md
            artifacts/queryset_health.diff.hybrid.json
            artifacts/queryset_health.diff.hybrid.md
            artifacts/queryset_health.diff.sparse.json
            artifacts/queryset_health.diff.sparse.md
            artifacts/parser_benchmark.current.json
            artifacts/parser_benchmark.diff.json
            artifacts/parser_benchmark.diff.md
            artifacts/retrieval_profile.grounded_strict.contract.json
            artifacts/claim_verifier.contract.json
            artifacts/queryset_health.history.jsonl
            artifacts/queryset_health.history.hybrid.jsonl
            artifacts/queryset_health.history.sparse.jsonl
            artifacts/queryset_health.cron.json
            artifacts/queryset_health.cron.hybrid.json
            artifacts/queryset_health.cron.sparse.json
            artifacts/adaptive_router_policy.v1.json
            artifacts/channel_budget_policy.v1.json
            artifacts/intent_router_training.v1.json
            artifacts/intent_router_model.v1.json
            artifacts/answer_quality.summary.json
            artifacts/answer_quality.gate.json
            artifacts/multihop_diagnostics.summary.json
            ci/parser_benchmark_baseline.v1.json
            ci/queryset_health_snapshot_baseline.v1.json
            ci/queryset_health_snapshot_hybrid_baseline.v1.json
            ci/queryset_health_snapshot_sparse_baseline.v1.json
            ci/queryset_health_policy.v1.json
            ci/retrieval_thresholds.v2.json

  retrieval-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    needs:
      - retrieval-only-bounded-gate
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mimirq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt

      - name: Download bounded gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: retrieval-only-bounded-gate
          path: bounded_gate_artifacts

      - name: Seed CI retrieval fixture (DB + cases bundle)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          mkdir -p artifacts
          python scripts/seed_ci_retrieval_regression.py \
            --fixture ci/retrieval_regression_fixture.v1.json \
            --out-cases artifacts/regression_cases.json

      - name: Start backend (no external deps)
        env:
          # Use the same DB seeded above.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
          # Ensure dev-friendly auth/membership auto-bootstrap.
          ENV: ci
          AUTH_MODE: header
          DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000000
          # Keep /health/ready green without Milvus/Redis/MinIO.
          VECTOR_BACKEND: faiss
          TASK_QUEUE_ENABLED: "false"
          EMBEDDING_CACHE_ENABLED: "false"
          MINIO_ENABLED: "false"
          # Keep lexical retrieval deterministic (no pg_trgm dependency in CI).
          LEXICAL_DB_TRGM_ENABLED: "false"
          # Exercise the real bounded hybrid stack in CI without external providers.
          ENABLE_RERANKER: "true"
          RERANKER_PROVIDER: "llm"
          RERANKER_TOP_N: "20"
          BM25_INDEX_ENABLED: "true"
          # Enable PII-safe metrics JSONL so we can also gate SLO + cost budgets.
          ENABLE_METRICS_LOG: "true"
          METRICS_LOG_PATH: artifacts/rag_metrics.jsonl
          # Avoid any external LLM calls in CI (probe traffic uses mock responses).
          LLM_MOCK_ENABLED: "true"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > artifacts/backend.pid

      - name: Wait for backend ready
        env:
          BACKEND_BASE_URL: http://localhost:8000
        run: |
          for i in $(seq 1 30); do
            if python scripts/api_ping.py; then
              exit 0
            fi
            sleep 1
          done
          echo "backend not ready" >&2
          exit 1

      - name: Run retrieval-only regression gate + generate candidate thresholds
        env:
          # Used by the backend process; keep env consistent for subprocesses.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          python scripts/regression_gate.py \
            --base-url http://localhost:8000/api/v1 \
            --tenant-id 00000000-0000-0000-0000-000000000000 \
            --user-id ci-bot \
            --cases artifacts/regression_cases.json \
            --metrics "" \
            --thresholds ci/retrieval_thresholds.v2.json \
            --retrieval-mode hybrid \
            --out-run-json artifacts/run.detail.json \
            --out-report-json artifacts/regression_gate.report.json \
            --out-report-md artifacts/regression_gate.report.md \
            --generate-thresholds-out artifacts/thresholds.generated.json

      - name: Must-recall + provenance gate
        run: |
          python scripts/must_recall_provenance_gate.py \
            --run-json artifacts/run.detail.json \
            --must-recall-min 1.0 \
            --provenance-min 1.0 \
            --out artifacts/must_recall_provenance_gate.report.json

      - name: Release gate (SLO + cost budgets)
        if: always()
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          python scripts/release_gate.py \
            --base-url http://localhost:8000/api/v1 \
            --tenant-id 00000000-0000-0000-0000-000000000000 \
            --user-id ci-bot \
            --budgets ci/release_gate_budgets.v1.json \
            --cases artifacts/regression_cases.json \
            --probe-chat-requests 4 \
            --probe-retrieval-mode hybrid \
            --probe-timeout-sec 20 \
            --queryset-health-snapshot bounded_gate_artifacts/artifacts/queryset_health.snapshot.json \
            --queryset-health-snapshot-hybrid bounded_gate_artifacts/artifacts/queryset_health.snapshot.hybrid.json \
            --queryset-health-diff bounded_gate_artifacts/artifacts/queryset_health.diff.json \
            --queryset-health-diff-hybrid bounded_gate_artifacts/artifacts/queryset_health.diff.hybrid.json \
            --skip-regression \
            --out-report artifacts/release_gate.report.json \
            --out-report-md artifacts/release_gate.report.md

      - name: Diff thresholds (baseline vs generated)
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import difflib
          from pathlib import Path

          a_path = Path("ci/retrieval_thresholds.v2.json")
          b_path = Path("artifacts/thresholds.generated.json")
          out_path = Path("artifacts/thresholds.diff.txt")

          if not b_path.exists():
              out_path.write_text("generated thresholds missing\n", encoding="utf-8")
              raise SystemExit(0)

          a = a_path.read_text(encoding="utf-8").splitlines(keepends=True)
          b = b_path.read_text(encoding="utf-8").splitlines(keepends=True)
          diff = "".join(
              difflib.unified_diff(
                  a,
                  b,
                  fromfile=str(a_path),
                  tofile=str(b_path),
              )
          )
          out_path.write_text(diff or "no changes\n", encoding="utf-8")
          PY

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-regression-gate
          path: |
            artifacts/**
            artifacts/must_recall_provenance_gate.report.json
            artifacts/release_gate.report.md
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/rollout.json
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/summary.json
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/report.json
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/gate.json
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/diff.json
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/diff.md
            bounded_gate_artifacts/artifacts/parsing_proof_broader_sample/review.md
            ci/retrieval_regression_fixture.v1.json
            ci/retrieval_thresholds.v2.json

      - name: Stop backend
        if: always()
        run: |
          if [ -f artifacts/backend.pid ]; then
            kill "$(cat artifacts/backend.pid)" || true
          fi

  kg-search-regression-gate:
