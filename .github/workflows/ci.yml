name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: OpenAPI types check
        run: make openapi-check

      - name: Backend tests
        run: make test

      - name: Repo verify
        run: make verify

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mimirq-backend -f docker/Dockerfile .

      - name: Build web image
        run: docker build -t mimirq-web -f web/Dockerfile.prod web

  retrieval-only-bounded-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Validate query-set health policy config
        run: |
          mkdir -p artifacts
          python scripts/validate_queryset_health_policy.py \
            --policy ci/queryset_health_policy.v1.json \
            --out artifacts/queryset_health_policy.normalized.json

      - name: Run deterministic sample retrieval benchmark
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_v1.json \
            --out artifacts/sample_retrieval_bench.json \
            --retrieval-mode keyword \
            --top-k 5

      - name: Run deterministic sample retrieval benchmark (hybrid bounded fixture)
        env:
          LLM_MOCK_ENABLED: "true"
        run: |
          mkdir -p artifacts
          python scripts/run_sample_retrieval_benchmark.py \
            --fixture data/sample/retrieval_fixture_hybrid_v1.json \
            --out artifacts/sample_retrieval_bench.hybrid.json \
            --retrieval-mode hybrid \
            --top-k 5

      - name: Build query-set health snapshot from bounded benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.json \
            --out artifacts/queryset_health.snapshot.json \
            --history artifacts/queryset_health.history.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.json

      - name: Build query-set health snapshot from bounded hybrid benchmark
        run: |
          python scripts/run_queryset_health_diagnostics.py \
            --benchmark-report artifacts/sample_retrieval_bench.hybrid.json \
            --out artifacts/queryset_health.snapshot.hybrid.json \
            --history artifacts/queryset_health.history.hybrid.jsonl \
            --policy-json ci/queryset_health_policy.v1.json \
            --cron | tee artifacts/queryset_health.cron.hybrid.json

      - name: Build query-set health diff artifacts
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.json \
            --out artifacts/queryset_health.diff.json \
            --out-md artifacts/queryset_health.diff.md

      - name: Build query-set health diff artifacts (hybrid)
        run: |
          python scripts/diff_queryset_health_snapshots.py \
            --a ci/queryset_health_snapshot_hybrid_baseline.v1.json \
            --b artifacts/queryset_health.snapshot.hybrid.json \
            --out artifacts/queryset_health.diff.hybrid.json \
            --out-md artifacts/queryset_health.diff.hybrid.md

      - name: Evaluate bounded retrieval-only gate (metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate] PASS")
          PY

      - name: Evaluate bounded retrieval-only gate (hybrid metric delta output)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("artifacts/sample_retrieval_bench.hybrid.json").read_text(encoding="utf-8"))
          cfg = json.loads(Path("ci/retrieval_thresholds.v2.json").read_text(encoding="utf-8"))
          bounded = cfg.get("ci_retrieval_only_bounded_gate_hybrid") if isinstance(cfg, dict) else {}
          thresholds = bounded.get("thresholds") if isinstance(bounded, dict) else {}
          summary = report.get("summary") if isinstance(report.get("summary"), dict) else {}

          failures = []
          for metric, raw in (thresholds or {}).items():
              if not isinstance(raw, dict):
                  continue
              try:
                  value = float(summary.get(metric))
              except Exception:
                  value = None
              if value is None:
                  failures.append((metric, "missing", raw, None))
                  continue
              if "min" in raw:
                  low = float(raw["min"])
                  if value < low:
                      failures.append((metric, value, {"min": low}, value - low))
              if "max" in raw:
                  high = float(raw["max"])
                  if value > high:
                      failures.append((metric, value, {"max": high}, value - high))

          if failures:
              print("[retrieval-only-bounded-gate-hybrid] FAIL: threshold violation(s)", file=sys.stderr)
              for metric, value, th, delta in failures:
                  print(
                      f"[retrieval-only-bounded-gate-hybrid] metric={metric} value={value} threshold={th} delta={delta}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-only-bounded-gate-hybrid] PASS")
          PY

      - name: Validate grounded_strict retrieval-profile contract
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from app.rag.core.retrieval_profiles import apply_retrieval_profile_overrides

          applied = apply_retrieval_profile_overrides(
              profile="grounded_strict",
              top_k=5,
              score_threshold=0.3,
              retrieval_mode="keyword",
              enable_reranker=False,
              reranker_provider="llm",
              reranker_top_n=5,
              enable_weight_rerank=True,
              retrieval_contract_mode="",
              visible_evidence_only=False,
          )

          expected = {
              "retrieval_mode": "hybrid",
              "retrieval_contract_mode": "evidence_strict",
              "visible_evidence_only": True,
              "enable_reranker": True,
              "reranker_provider": "cross_encoder",
              "enable_weight_rerank": False,
          }
          failures = []
          for key, expected_value in expected.items():
              if applied.get(key) != expected_value:
                  failures.append((key, applied.get(key), expected_value))

          if int(applied.get("top_k") or 0) < 20:
              failures.append(("top_k", applied.get("top_k"), ">=20"))
          if int(applied.get("reranker_top_n") or 0) < 20:
              failures.append(("reranker_top_n", applied.get("reranker_top_n"), ">=20"))

          out_path = Path("artifacts/retrieval_profile.grounded_strict.contract.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(
              json.dumps(
                  {
                      "schema": "mimirq.retrieval_profile_contract.v1",
                      "profile": "grounded_strict",
                      "applied": applied,
                      "failures": failures,
                  },
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              ),
              encoding="utf-8",
          )

          if failures:
              print("[retrieval-profile-grounded-strict] FAIL", file=sys.stderr)
              for key, value, expected_value in failures:
                  print(
                      f"[retrieval-profile-grounded-strict] key={key} value={value} expected={expected_value}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print("[retrieval-profile-grounded-strict] PASS")
          PY

      - name: Upload bounded gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-only-bounded-gate
          path: |
            artifacts/sample_retrieval_bench.json
            artifacts/sample_retrieval_bench.hybrid.json
            artifacts/queryset_health_policy.normalized.json
            artifacts/queryset_health.snapshot.json
            artifacts/queryset_health.snapshot.hybrid.json
            artifacts/queryset_health.diff.json
            artifacts/queryset_health.diff.md
            artifacts/queryset_health.diff.hybrid.json
            artifacts/queryset_health.diff.hybrid.md
            artifacts/retrieval_profile.grounded_strict.contract.json
            artifacts/queryset_health.history.jsonl
            artifacts/queryset_health.history.hybrid.jsonl
            artifacts/queryset_health.cron.json
            artifacts/queryset_health.cron.hybrid.json
            ci/queryset_health_snapshot_baseline.v1.json
            ci/queryset_health_snapshot_hybrid_baseline.v1.json
            ci/queryset_health_policy.v1.json
            ci/retrieval_thresholds.v2.json

  retrieval-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mimirq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Seed CI retrieval fixture (DB + cases bundle)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          mkdir -p artifacts
          python scripts/seed_ci_retrieval_regression.py \
            --fixture ci/retrieval_regression_fixture.v1.json \
            --out-cases artifacts/regression_cases.json

      - name: Start backend (no external deps)
        env:
          # Use the same DB seeded above.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
          # Ensure dev-friendly auth/membership auto-bootstrap.
          ENV: ci
          AUTH_MODE: header
          DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000000
          # Keep /health/ready green without Milvus/Redis/MinIO.
          VECTOR_BACKEND: faiss
          TASK_QUEUE_ENABLED: "false"
          EMBEDDING_CACHE_ENABLED: "false"
          MINIO_ENABLED: "false"
          # Keep lexical retrieval deterministic (no pg_trgm dependency in CI).
          LEXICAL_DB_TRGM_ENABLED: "false"
          # Exercise the real bounded hybrid stack in CI without external providers.
          ENABLE_RERANKER: "true"
          RERANKER_PROVIDER: "llm"
          RERANKER_TOP_N: "20"
          BM25_INDEX_ENABLED: "true"
          # Enable PII-safe metrics JSONL so we can also gate SLO + cost budgets.
          ENABLE_METRICS_LOG: "true"
          METRICS_LOG_PATH: artifacts/rag_metrics.jsonl
          # Avoid any external LLM calls in CI (probe traffic uses mock responses).
          LLM_MOCK_ENABLED: "true"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > artifacts/backend.pid

      - name: Wait for backend ready
        env:
          BACKEND_BASE_URL: http://localhost:8000
        run: |
          for i in $(seq 1 30); do
            if python scripts/api_ping.py; then
              exit 0
            fi
            sleep 1
          done
          echo "backend not ready" >&2
          exit 1

      - name: Run retrieval-only regression gate + generate candidate thresholds
        continue-on-error: true
        env:
          # Used by the backend process; keep env consistent for subprocesses.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          python scripts/regression_gate.py \
            --base-url http://localhost:8000/api/v1 \
            --tenant-id 00000000-0000-0000-0000-000000000000 \
            --user-id ci-bot \
            --cases artifacts/regression_cases.json \
            --metrics "" \
            --thresholds ci/retrieval_thresholds.v2.json \
            --retrieval-mode hybrid \
            --out-run-json artifacts/run.detail.json \
            --out-report-json artifacts/regression_gate.report.json \
            --out-report-md artifacts/regression_gate.report.md \
            --generate-thresholds-out artifacts/thresholds.generated.json

      - name: Release gate (SLO + cost budgets)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          python scripts/release_gate.py \
            --base-url http://localhost:8000/api/v1 \
            --tenant-id 00000000-0000-0000-0000-000000000000 \
            --user-id ci-bot \
            --budgets ci/release_gate_budgets.v1.json \
            --cases artifacts/regression_cases.json \
            --probe-chat-requests 4 \
            --probe-timeout-sec 20 \
            --skip-regression \
            --out-report artifacts/release_gate.report.json

      - name: Diff thresholds (baseline vs generated)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import difflib
          from pathlib import Path

          a_path = Path("ci/retrieval_thresholds.v2.json")
          b_path = Path("artifacts/thresholds.generated.json")
          out_path = Path("artifacts/thresholds.diff.txt")

          a = a_path.read_text(encoding="utf-8").splitlines(keepends=True)
          b = b_path.read_text(encoding="utf-8").splitlines(keepends=True)
          diff = "".join(
              difflib.unified_diff(
                  a,
                  b,
                  fromfile=str(a_path),
                  tofile=str(b_path),
              )
          )
          out_path.write_text(diff or "no changes\n", encoding="utf-8")
          PY

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-regression-gate
          path: |
            artifacts/**
            ci/retrieval_regression_fixture.v1.json
            ci/retrieval_thresholds.v2.json

      - name: Stop backend
        if: always()
        run: |
          if [ -f artifacts/backend.pid ]; then
            kill "$(cat artifacts/backend.pid)" || true
          fi

  kg-search-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mimirq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Seed CI KG search fixture (DB + KG rows + cases bundle)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          mkdir -p artifacts
          python scripts/seed_ci_kg_search_regression.py \
            --fixture ci/kg_search_regression_fixture.v1.json \
            --out-cases artifacts/kg_regression_cases.json

      - name: Start backend (KG enabled, no Milvus/embeddings)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
          ENV: ci
          AUTH_MODE: header
          DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000000
          VECTOR_BACKEND: faiss
          TASK_QUEUE_ENABLED: "false"
          EMBEDDING_CACHE_ENABLED: "false"
          MINIO_ENABLED: "false"
          LEXICAL_DB_TRGM_ENABLED: "false"
          ENABLE_RERANKER: "false"
          BM25_INDEX_ENABLED: "false"
          KG_ENABLED: "true"
          KG_SEARCH_VECTOR_RECALL_ENABLED: "false"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > artifacts/backend.pid

      - name: Wait for backend ready
        env:
          BACKEND_BASE_URL: http://localhost:8000
        run: |
          for i in $(seq 1 30); do
            if python scripts/api_ping.py; then
              exit 0
            fi
            sleep 1
          done
          echo "backend not ready" >&2
          exit 1

      - name: Run KG search regression gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mimirq
        run: |
          python scripts/kg_search_regression_gate.py \
            --base-url http://localhost:8000/api/v1 \
            --tenant-id 00000000-0000-0000-0000-000000000000 \
            --user-id ci-bot \
            --cases artifacts/kg_regression_cases.json \
            --thresholds ci/kg_search_thresholds.v1.json \
            --k 10 \
            --out-run-json artifacts/kg.diagnostics.json

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kg-search-regression-gate
          path: |
            artifacts/**
            ci/kg_search_regression_fixture.v1.json
            ci/kg_search_thresholds.v1.json

      - name: Stop backend
        if: always()
        run: |
          if [ -f artifacts/backend.pid ]; then
            kill "$(cat artifacts/backend.pid)" || true
          fi
