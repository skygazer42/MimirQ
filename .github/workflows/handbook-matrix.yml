name: Handbook FE/BE matrix freshness

# When API or web client/routes change, ensure fe-be-matrix.mdx is regenerated and committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies (OpenAPI export)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 10 --timeout 120 \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Export OpenAPI and verify matrix is up to date
        run: |
          make openapi-export
          python scripts/docs/generate_fe_be_matrix.py
          git diff --exit-code docs-site/docs/integration/generated/fe-be-matrix.mdx
