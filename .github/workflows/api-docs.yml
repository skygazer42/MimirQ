name: Deploy API docs to GitHub Pages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-api-docs
  cancel-in-progress: false

env:
  SELF_HOSTED_PYTHON_BIN: /home/user/.local/share/uv/python/cpython-3.11.13-linux-x86_64-gnu/bin
  PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
  SELF_HOSTED_HTTP_PROXY: http://127.0.0.1:35983
  SELF_HOSTED_HTTPS_PROXY: http://127.0.0.1:35983
  SELF_HOSTED_ALL_PROXY: socks://127.0.0.1:35983/
  SELF_HOSTED_NO_PROXY: 127.0.0.1,localhost,muyuan.do

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          HTTP_PROXY: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          HTTPS_PROXY: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          ALL_PROXY: ${{ env.SELF_HOSTED_ALL_PROXY }}
          http_proxy: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          https_proxy: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          all_proxy: ${{ env.SELF_HOSTED_ALL_PROXY }}
          NO_PROXY: ${{ env.SELF_HOSTED_NO_PROXY }}
          no_proxy: ${{ env.SELF_HOSTED_NO_PROXY }}

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          VENV_DIR="$RUNNER_TEMP/mimirq-py311"
          "$SELF_HOSTED_PYTHON_BIN/python3.11" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" --version

      - name: Setup Python
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          node -v
          npm -v

      - name: Setup Node.js (handbook build)
        if: ${{ !(runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01') }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build static API site (OpenAPI + Redoc + Docusaurus handbook)
        run: make api-docs-build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
