name: Deploy API docs to GitHub Pages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-api-docs
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: ${{ vars.CI_SELF_HOSTED_PYTHON_BIN || '' }}
  SELF_HOSTED_VENV_DIR: ${{ vars.CI_SELF_HOSTED_VENV_DIR || '' }}
  PIP_INDEX_URL: ${{ vars.CI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
  PIP_CACHE_DIR: ${{ vars.CI_PIP_CACHE_DIR || '' }}
  TORCH_WHEEL_DIR: ${{ vars.CI_TORCH_WHEEL_DIR || '' }}
  SELF_HOSTED_HTTP_PROXY: ${{ vars.CI_HTTP_PROXY || '' }}
  SELF_HOSTED_HTTPS_PROXY: ${{ vars.CI_HTTPS_PROXY || '' }}
  SELF_HOSTED_NO_PROXY: ${{ vars.CI_NO_PROXY || '' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_CACHE_DIR: /home/runner/.cache/pip
      TORCH_WHEEL_DIR: /home/runner/.cache/torch-wheels
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          mkdir -p "$PIP_CACHE_DIR" "$TORCH_WHEEL_DIR"
          python -m pip install --upgrade pip
          python ci/download_verified_wheels.py --cache-dir "$TORCH_WHEEL_DIR"
          python -m pip install --retries 5 --timeout 120 \
            "$TORCH_WHEEL_DIR/torch-2.13.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "$TORCH_WHEEL_DIR/torchvision-0.28.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --retries 10 --timeout 120 -r requirements.txt

      - name: Build API site
        run: make api-docs-build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 45
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
        env:
          http_proxy: ${{ vars.CI_HTTP_PROXY || '' }}
          https_proxy: ${{ vars.CI_HTTPS_PROXY || '' }}
          no_proxy: ${{ vars.CI_NO_PROXY != '' && format('127.0.0.1,localhost,{0}', vars.CI_NO_PROXY) || '127.0.0.1,localhost' }}

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' }}
        run: bash scripts/prepare_self_hosted_ci.sh --include-torch-wheel-dir

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          node -v
          npm -v

      - name: Check GitHub Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          status=$(curl --noproxy '*' -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404|422)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping GitHub Pages deploy because Pages is unavailable for ${GITHUB_REPOSITORY} (HTTP ${status})."
              cat /tmp/pages.json
              ;;
            *)
              echo "Unexpected GitHub Pages API status: ${status}" >&2
              cat /tmp/pages.json >&2
              exit 1
              ;;
          esac

      - name: Install Python dependencies
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p "$PIP_CACHE_DIR" "$TORCH_WHEEL_DIR"
          python -m pip install --upgrade pip
          python ci/download_verified_wheels.py --cache-dir "$TORCH_WHEEL_DIR"
          python -m pip install --retries 5 --timeout 120 \
            "$TORCH_WHEEL_DIR/torch-2.13.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "$TORCH_WHEEL_DIR/torchvision-0.28.0+cpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --retries 10 --timeout 120 -r requirements.txt

      - name: Build API site (OpenAPI + Redoc + Docusaurus handbook)
        if: steps.pages.outputs.enabled == 'true'
        run: make api-docs-build

      - name: Upload API site artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-site
          path: docs/api/site
          if-no-files-found: error

      - name: Summarize built API docs output
        if: always()
        run: |
          echo "Built docs/api/site contents:"
          ls -la docs/api/site 2>/dev/null || true

  publish:
    needs: deploy
    if: ${{ github.event_name != 'pull_request' && needs.deploy.outputs.pages_enabled == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download API site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-docs-site
          path: docs/api/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
