name: Deploy API docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-api-docs
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: /home/user/.local/share/uv/python/cpython-3.11.13-linux-x86_64-gnu/bin
  SELF_HOSTED_VENV_DIR: /data/actions-runner/mimirq-main-01/_tool/mimirq-py311
  PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
  PIP_CACHE_DIR: /data/actions-runner/pip-cache

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 45
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
        env:
          http_proxy: http://127.0.0.1:35983
          https_proxy: http://127.0.0.1:35983
          no_proxy: 127.0.0.1,localhost,${{ vars.CI_NO_PROXY }}

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          VENV_DIR="${SELF_HOSTED_VENV_DIR:-$RUNNER_TEMP/mimirq-py311}"
          mkdir -p "$(dirname "$VENV_DIR")"
          "$SELF_HOSTED_PYTHON_BIN/python3.11" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" --version

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          node -v
          npm -v

      - name: Build static API site (OpenAPI + Redoc + Docusaurus handbook)
        run: make api-docs-build-static

      - name: Check GitHub Pages availability
        if: github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          status=$(curl --noproxy '*' -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404|422)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping GitHub Pages deploy because Pages is unavailable for ${GITHUB_REPOSITORY} (HTTP ${status})."
              cat /tmp/pages.json
              ;;
            *)
              echo "Unexpected GitHub Pages API status: ${status}" >&2
              cat /tmp/pages.json >&2
              exit 1
              ;;
          esac

      - name: Summarize built API docs output
        if: always()
        run: |
          echo "Built docs/api/site contents:"
          ls -la docs/api/site 2>/dev/null || true

  publish:
    needs: deploy
    if: ${{ github.event_name != 'pull_request' && needs.deploy.outputs.pages_enabled == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build static API site (OpenAPI + Redoc + Docusaurus handbook)
        run: make api-docs-build-static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/api/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
