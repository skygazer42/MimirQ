name: Deploy API docs to GitHub Pages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-api-docs
  cancel-in-progress: true

env:
  SELF_HOSTED_PYTHON_BIN: /home/user/.local/share/uv/python/cpython-3.11.13-linux-x86_64-gnu/bin
  PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, mimirq]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
        env:
          http_proxy: http://127.0.0.1:35983
          https_proxy: http://127.0.0.1:35983
          no_proxy: 127.0.0.1,localhost,muyuan.do

      - name: Prepare self-hosted Python
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          VENV_DIR="$RUNNER_TEMP/mimirq-py311"
          "$SELF_HOSTED_PYTHON_BIN/python3.11" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt

      - name: Prepare self-hosted Node
        if: ${{ runner.environment == 'self-hosted' || runner.name == 'mimirq-main-01' }}
        run: |
          node -v
          npm -v

      - name: Build static API site (OpenAPI + Redoc + Docusaurus handbook)
        run: make api-docs-build

      - name: Check GitHub Pages availability
        if: github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          status=$(curl --noproxy '*' -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404|422)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping GitHub Pages deploy because Pages is unavailable for ${GITHUB_REPOSITORY} (HTTP ${status})."
              cat /tmp/pages.json
              ;;
            *)
              echo "Unexpected GitHub Pages API status: ${status}" >&2
              cat /tmp/pages.json >&2
              exit 1
              ;;
          esac

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
