name: Deploy API docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/export_openapi.py"
      - "scripts/openapi_paths_sanity.py"
      - "scripts/docs/**"
      - "docs/api/site/index.html"
      - "docs-site/**"
      - "docs/API.md"
      - "docs/api/reference/**"
      - "Makefile"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-api-docs
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --retries 5 --timeout 120 \
            "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl" \
            "torchvision @ https://download-r2.pytorch.org/whl/cpu/torchvision-0.25.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Setup Node.js (handbook build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build static API site (OpenAPI + Redoc + Docusaurus handbook)
        run: make api-docs-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
