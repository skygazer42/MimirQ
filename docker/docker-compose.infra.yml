services:
  mimirq-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimirq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mimirq-redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mimirq-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCDCTL_API=3
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://mimirq-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  mimirq-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mimirq-milvus:
    image: milvusdb/milvus:v2.3.5
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: mimirq-etcd:2379
      MINIO_ADDRESS: mimirq-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      mimirq-etcd:
        condition: service_healthy
      mimirq-minio:
        condition: service_healthy

  # ETL4LLM (Bisheng Unstructured) parser service (optional).
  # Enable with: `docker compose -f docker/docker-compose.infra.yml --profile etl4llm up -d`
  mimirq-etl4llm:
    profiles: ["etl4llm"]
    image: dataelement/bisheng-unstructured:v0.0.3.14
    restart: unless-stopped
    ports:
      - "10001:10001"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Marker PDF -> Markdown parser service (optional; heavyweight).
  # Enable with: `docker compose -f docker/docker-compose.infra.yml --profile marker up -d --build`
  mimirq-marker:
    profiles: ["marker"]
    build:
      context: ./marker
    restart: unless-stopped
    ports:
      - "2080:2080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - marker_cache:/root/.cache

  # PaddleOCR-VL parser service (optional; heavyweight).
  # Enable with: `docker compose -f docker/docker-compose.infra.yml --profile paddlevl up -d --build`
  mimirq-paddlevl:
    profiles: ["paddlevl"]
    build:
      context: ./paddlevl
    restart: unless-stopped
    ports:
      - "9030:9030"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - paddlevl_cache:/root/.paddleocr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9030/health').read()",
        ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  marker_cache:
  paddlevl_cache:
