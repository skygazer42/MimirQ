x-backend-build: &backend_build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    # Optional build metadata (exposed via /api/v1/meta)
    MIMIRQ_BUILD_SHA: ${MIMIRQ_BUILD_SHA:-}
    MIMIRQ_BUILD_TIME: ${MIMIRQ_BUILD_TIME:-}

x-backend-env: &backend_env
  PYTHONDONTWRITEBYTECODE: 1
  # Process settings (overrides Dockerfile defaults)
  UVICORN_WORKERS: ${BACKEND_WORKERS:-1}
  # Force container-to-container endpoints (do not depend on host-local `.env` defaults like localhost).
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mimirq-postgres:5432/${POSTGRES_DB:-mimirq}
  # Lite defaults: local vector store and no object storage (lower resource usage).
  VECTOR_BACKEND: ${VECTOR_BACKEND_LITE:-chroma}
  FAISS_STORE_PATH: ${FAISS_STORE_PATH_DOCKER:-/data/vector_faiss}
  CHROMA_PERSIST_PATH: ${CHROMA_PERSIST_PATH_DOCKER:-/data/vector_chroma}
  MINIO_ENABLED: ${MINIO_ENABLED_LITE_DOCKER:-false}
  MINIO_DOCUMENTS_ENABLED: ${MINIO_DOCUMENTS_ENABLED_LITE_DOCKER:-false}
  # CORS (frontend)
  CORS_ORIGINS: ${CORS_ORIGINS_DOCKER:-http://localhost:3000,http://localhost:3001}
  # Task queue
  TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED_DOCKER:-true}
  REDIS_URL: ${REDIS_URL_DOCKER:-redis://mimirq-redis:6379/0}
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME_DOCKER:-mimirq}
  TASK_WORKER_MAX_JOBS: ${TASK_WORKER_MAX_JOBS_DOCKER:-4}
  # Persisted data dirs (mounted as volumes; avoid coupling to /app code mounts).
  UPLOAD_DIR: ${UPLOAD_DIR_DOCKER:-/data/uploads}

x-docker-logging: &docker_logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  # Redis（任务队列/缓存/幂等锁）
  mimirq-redis:
    image: redis:7
    restart: unless-stopped
    logging: *docker_logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL 数据库
  mimirq-postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *docker_logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimirq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端（lite：Chroma/FAISS，无 Milvus/MinIO）
  mimirq-api:
    build: *backend_build
    restart: unless-stopped
    logging: *docker_logging
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      mimirq-postgres:
        condition: service_healthy
      mimirq-redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *backend_env
      TABLE_STORE_DIR: /data/uploads/table_store
    volumes:
      - upload_data:/data/uploads
      - vector_data:/data/vector_chroma

  # Arq worker（后台处理文档解析/索引）
  mimirq-worker:
    build: *backend_build
    restart: unless-stopped
    logging: *docker_logging
    # Worker uses the same image as backend, but does not expose HTTP; disable image healthcheck.
    # NOTE: `disable: true` isn't supported by some older docker-compose versions; use NONE for compatibility.
    healthcheck:
      test: ["NONE"]
    depends_on:
      mimirq-redis:
        condition: service_healthy
      mimirq-postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *backend_env
      TABLE_STORE_DIR: /data/uploads/table_store
    volumes:
      - upload_data:/data/uploads
      - vector_data:/data/vector_chroma
    command: arq app.tasks.worker.WorkerSettings

volumes:
  postgres_data:
  upload_data:
  vector_data:
