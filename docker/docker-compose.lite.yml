name: ${COMPOSE_PROJECT_NAME:-mimirq}

x-backend-build: &backend_build
  context: ..
  dockerfile: docker/Dockerfile
  network: ${DOCKER_BUILD_NETWORK:-default}
  args:
    REQUIREMENTS_FILE: ${BACKEND_REQUIREMENTS_FILE:-requirements.txt}
    # Optional build metadata (exposed via /api/v1/meta)
    MIMIRQ_BUILD_SHA: ${MIMIRQ_BUILD_SHA:-}
    MIMIRQ_BUILD_TIME: ${MIMIRQ_BUILD_TIME:-}

x-backend-env: &backend_env
  PYTHONDONTWRITEBYTECODE: 1
  HOST: 0.0.0.0
  PORT: 8000
  # Process settings (overrides Dockerfile defaults)
  UVICORN_WORKERS: ${BACKEND_WORKERS:-1}
  # Force container-to-container endpoints (do not depend on host-local `.env` defaults like localhost).
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mimirq-postgres:5432/${POSTGRES_DB:-mimirq}
  # Shared persistent vector storage; document object storage remains disabled.
  VECTOR_BACKEND: ${VECTOR_BACKEND_LITE:-milvus}
  MILVUS_HOST: mimirq-milvus
  MILVUS_PORT: ${MILVUS_PORT_DOCKER:-19530}
  MILVUS_USER: ${MILVUS_USER_DOCKER:-}
  MILVUS_PASSWORD: ${MILVUS_PASSWORD_DOCKER:-}
  MINIO_ENABLED: ${MINIO_ENABLED_LITE_DOCKER:-false}
  MINIO_DOCUMENTS_ENABLED: ${MINIO_DOCUMENTS_ENABLED_LITE_DOCKER:-false}
  # CORS (frontend)
  CORS_ORIGINS: ${CORS_ORIGINS_DOCKER:-http://localhost:3000,http://localhost:3001}
  # Task queue
  TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED_DOCKER:-true}
  REDIS_URL: ${REDIS_URL_DOCKER:-redis://mimirq-redis:6379/0}
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME_DOCKER:-mimirq}
  TASK_WORKER_MAX_JOBS: ${TASK_WORKER_MAX_JOBS_DOCKER:-4}
  # API and worker share Milvus and Redis-backed idempotency/admission.
  UPLOAD_DEDUP_ENABLED: ${UPLOAD_DEDUP_ENABLED_DOCKER:-true}
  RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_ENABLED: ${RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_ENABLED_DOCKER:-true}
  RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_MAX_CONCURRENCY: ${RAG_RETRIEVAL_DISTRIBUTED_ADMISSION_MAX_CONCURRENCY_DOCKER:-3}
  # Persisted data dirs (mounted as volumes; avoid coupling to /app code mounts).
  UPLOAD_DIR: ${UPLOAD_DIR_DOCKER:-/data/uploads}

x-docker-logging: &docker_logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  # Redis（任务队列/缓存/幂等锁）
  mimirq-redis:
    image: redis:7
    restart: unless-stopped
    logging: *docker_logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL 数据库
  mimirq-postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *docker_logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimirq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端（共享 Milvus，关闭文档对象存储）
  mimirq-api:
    build: *backend_build
    restart: unless-stopped
    logging: *docker_logging
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      # Empty databases can spend several minutes creating the initial schema.
      start_period: ${API_HEALTHCHECK_START_PERIOD:-240s}
    depends_on:
      mimirq-postgres:
        condition: service_healthy
      mimirq-redis:
        condition: service_healthy
      mimirq-milvus:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *backend_env
      TABLE_STORE_DIR: /data/uploads/table_store
    volumes:
      - upload_data:/data/uploads

  # Arq worker（后台处理文档解析/索引）
  mimirq-worker:
    build: *backend_build
    restart: unless-stopped
    logging: *docker_logging
    healthcheck:
      test: ["CMD", "arq", "--check", "app.tasks.queue.WorkerHealthSettings"]
      interval: ${WORKER_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${WORKER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${WORKER_HEALTHCHECK_RETRIES:-3}
      start_period: ${WORKER_HEALTHCHECK_START_PERIOD:-45s}
    depends_on:
      mimirq-redis:
        condition: service_healthy
      mimirq-postgres:
        condition: service_healthy
      mimirq-milvus:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *backend_env
      TABLE_STORE_DIR: /data/uploads/table_store
    volumes:
      - upload_data:/data/uploads
    command: arq app.tasks.worker.WorkerSettings

  mimirq-etcd:
    extends:
      file: docker-compose.yml
      service: mimirq-etcd

  mimirq-minio:
    extends:
      file: docker-compose.yml
      service: mimirq-minio

  mimirq-milvus:
    extends:
      file: docker-compose.yml
      service: mimirq-milvus

volumes:
  postgres_data:
  upload_data:
  etcd_data:
  minio_data:
  milvus_data:
