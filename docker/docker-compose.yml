x-backend-build: &backend_build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    # Optional build metadata (exposed via /api/v1/meta)
    MIMIRQ_BUILD_SHA: ${MIMIRQ_BUILD_SHA:-}
    MIMIRQ_BUILD_TIME: ${MIMIRQ_BUILD_TIME:-}

x-backend-env: &backend_env
  PYTHONDONTWRITEBYTECODE: 1
  # Process settings (overrides Dockerfile defaults)
  UVICORN_WORKERS: ${BACKEND_WORKERS:-1}
  # Force container-to-container endpoints (do not depend on host-local `.env` defaults like localhost).
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mimirq-postgres:5432/${POSTGRES_DB:-mimirq}
  MILVUS_HOST: ${MILVUS_HOST_DOCKER:-mimirq-milvus}
  MILVUS_PORT: ${MILVUS_PORT_DOCKER:-19530}
  # Persisted data dirs (mounted as volumes; avoid coupling to /app code mounts).
  UPLOAD_DIR: ${UPLOAD_DIR_DOCKER:-/data/uploads}
  # MinIO for images
  MINIO_ENABLED: ${MINIO_ENABLED_DOCKER:-true}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT_DOCKER:-mimirq-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME_DOCKER:-mimirq}
  MINIO_USE_SSL: ${MINIO_USE_SSL_DOCKER:-false}
  MINIO_DOCUMENTS_ENABLED: ${MINIO_DOCUMENTS_ENABLED_DOCKER:-true}
  # CORS (frontend)
  CORS_ORIGINS: ${CORS_ORIGINS_DOCKER:-http://localhost:3000,http://localhost:3001,http://web:3000}
  # Task queue
  TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED_DOCKER:-true}
  REDIS_URL: ${REDIS_URL_DOCKER:-redis://mimirq-redis:6379/0}
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME_DOCKER:-mimirq}
  TASK_WORKER_MAX_JOBS: ${TASK_WORKER_MAX_JOBS_DOCKER:-4}

x-docker-logging: &docker_logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  # Redis（任务队列/缓存/幂等锁）
  mimirq-redis:
    image: redis:7
    restart: unless-stopped
    logging: *docker_logging
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy",
        "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL 数据库
  mimirq-postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *docker_logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimirq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
        "-c",
        "work_mem=${POSTGRES_WORK_MEM:-16MB}",
        "-c",
        "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}",
      ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus Etcd (元数据存储)
  mimirq-etcd:
    # quay.io can be unreachable in some networks; use a public mirror image instead.
    image: registry.k8s.io/etcd:3.5.5-0
    restart: unless-stopped
    logging: *docker_logging
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCDCTL_API=3
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://mimirq-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus MinIO (对象存储)
  mimirq-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    logging: *docker_logging
    environment:
      # Modern env names (also keep the old ones for compatibility with older images).
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 向量数据库
  mimirq-milvus:
    image: milvusdb/milvus:v2.3.5
    restart: unless-stopped
    logging: *docker_logging
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: mimirq-etcd:2379
      MINIO_ADDRESS: mimirq-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      mimirq-etcd:
        condition: service_healthy
      mimirq-minio:
        condition: service_healthy

  # FastAPI 后端
  mimirq-api:
    build: *backend_build
    restart: unless-stopped
    logging: *docker_logging
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      mimirq-postgres:
        condition: service_healthy
      mimirq-milvus:
        condition: service_healthy
      mimirq-redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *backend_env
    volumes:
      - upload_data:/data/uploads
      # Reuse the MinerU/PDF-Extract-Kit cache for MagicPDF local parsing.
      # Mounted read-only; populate/update it via the optional mineru parser service.
      - mineru_cache:/opt/mimirq-model-cache:ro

  # Arq worker（后台处理文档解析/索引）
  mimirq-worker:
    build: *backend_build
    restart: unless-stopped
    logging: *docker_logging
    # Worker uses the same image as backend, but does not expose HTTP; disable image healthcheck.
    # NOTE: `disable: true` isn't supported by some older docker-compose versions; use NONE for compatibility.
    healthcheck:
      test: ["NONE"]
    depends_on:
      mimirq-redis:
        condition: service_healthy
      mimirq-postgres:
        condition: service_healthy
      mimirq-milvus:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      <<: *backend_env
    volumes:
      - upload_data:/data/uploads
      # Worker runs persisted ingestion; it needs the same local MagicPDF models.
      - mineru_cache:/opt/mimirq-model-cache:ro
    command: arq app.tasks.worker.WorkerSettings

volumes:
  # PostgreSQL data dir (/var/lib/postgresql/data)
  postgres_data:
  # Milvus metadata store (etcd)
  etcd_data:
  # Milvus object store (minio)
  minio_data:
  # Milvus vector data dir (/var/lib/milvus)
  milvus_data:
  # Uploaded documents + derived artifacts (/data/uploads)
  upload_data:
  # Shared MinerU/PDF-Extract-Kit model cache, also used by MagicPDF local parser.
  mineru_cache:
