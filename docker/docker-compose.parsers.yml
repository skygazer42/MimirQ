# Optional external parser services (heavyweight).
#
# Usage examples (from repo root):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.parsers.yml --profile marker up -d --build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.parsers.yml --profile paddlevl up -d --build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.parsers.yml --profile mineru up -d --build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.parsers.yml --profile olmocr up -d --build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.parsers.yml --profile qianfanocr up -d --build
#
# For local backend development (infra only):
#   docker compose -f docker/docker-compose.infra.yml -f docker/docker-compose.parsers.yml --profile mineru up -d --build

services:
  # ETL4LLM (Bisheng Unstructured) parser service (optional).
  # Then set `ETL4LLM_ENABLED=true` and `ETL4LLM_API_URL=http://mimirq-etl4llm:10001/v1/etl4llm/predict` in the root .env.
  mimirq-etl4llm:
    profiles: ["etl4llm"]
    image: dataelement/bisheng-unstructured:v0.0.3.14
    restart: unless-stopped
    hostname: mimirq-etl4llm
    environment:
      TZ: Asia/Shanghai
    networks:
      default:
        aliases:
          - mimirq-etl4llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Marker PDF -> Markdown parser service (optional; heavyweight).
  # Then set `MARKER_ENABLED=true` and `MARKER_API_URL=http://mimirq-marker:2080/convert` in the root .env.
  mimirq-marker:
    profiles: ["marker"]
    build:
      context: ./marker
    restart: unless-stopped
    hostname: mimirq-marker
    ports:
      - "2080:2080"
    environment:
      TZ: Asia/Shanghai
    networks:
      default:
        aliases:
          - mimirq-marker
    volumes:
      - marker_cache:/root/.cache

  # PaddleOCR-VL parser service (optional; heavyweight).
  # Then set `PADDLE_VL_ENABLED=true` and `PADDLE_VL_API_URL=http://127.0.0.1:9030/convert` in the root .env.
  mimirq-paddlevl:
    profiles: ["paddlevl"]
    build:
      context: ./paddlevl
    restart: unless-stopped
    network_mode: "service:mimirq-api"
    gpus: all
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Service-side options (PaddleOCR doc_parser / PaddleOCR-VL pipeline).
      PADDLEOCR_PIPELINE_VERSION: ${PADDLEOCR_PIPELINE_VERSION:-v1.5}
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-gpu:0}
      PADDLEOCR_PIPELINE_TIMEOUT_SEC: ${PADDLEOCR_PIPELINE_TIMEOUT_SEC:-1800}
      # Skip startup connectivity probes against upstream model mirrors; the
      # runtime convert endpoint will still surface real download/model errors.
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: ${PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK:-True}
    volumes:
      - paddlevl_cache:/root/.paddleocr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9030/health').read()",
        ]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinerU local FastAPI service (optional; heavy; typically requires GPU).
  # Then set `MINERU_ENABLED=true` and `MINERU_LOCAL_SERVER_URL=http://mimirq-mineru:8000` in the root .env.
  mimirq-mineru:
    profiles: ["mineru"]
    build:
      context: ./mineru
    restart: unless-stopped
    hostname: mimirq-mineru
    ports:
      # Avoid clashing with MimirQ backend (8000).
      - "30001:8000"
    environment:
      TZ: Asia/Shanghai
      # Model source: "huggingface" (default) or "modelscope" (China-friendly mirror).
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-huggingface}
      # Keep FastAPI docs enabled by default (so /docs and /openapi.json work).
      MINERU_API_ENABLE_FASTAPI_DOCS: ${MINERU_API_ENABLE_FASTAPI_DOCS:-1}
      # Optional: limit concurrent requests at MinerU side (503 when saturated).
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-1}
    networks:
      default:
        aliases:
          - mimirq-mineru
    volumes:
      # Persist downloaded models/caches across restarts.
      - mineru_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/openapi.json >/dev/null || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10

  # olmOCR PDF -> Markdown parser service (optional; heavyweight; requires GPU).
  # Then set `OLMOCR_ENABLED=true` and `OLMOCR_API_URL=http://127.0.0.1:2085/convert` in the root .env.
  mimirq-olmocr:
    profiles: ["olmocr"]
    build:
      context: ./olmocr
    restart: unless-stopped
    network_mode: "service:mimirq-api"
    gpus: all
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Server-side concurrency guard (1 = recommended for a single GPU).
      OLMOCR_MAX_CONCURRENT_JOBS: ${OLMOCR_MAX_CONCURRENT_JOBS:-1}
      OLMOCR_PIPELINE_TIMEOUT_SEC: ${OLMOCR_PIPELINE_TIMEOUT_SEC:-1800}
      # Optional: external OpenAI-compatible server mode (vLLM on another host).
      OLMOCR_SERVER_URL: ${OLMOCR_SERVER_URL:-}
      OLMOCR_API_KEY: ${OLMOCR_API_KEY:-}
      OLMOCR_MODEL: ${OLMOCR_MODEL:-}
    volumes:
      - olmocr_cache:/root/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:2085/health').read()",
        ]
      interval: 30s
      timeout: 20s
      retries: 3

  # Qianfan-OCR wrapper service (optional; calls an OpenAI-compatible vision endpoint).
  # Then set `QIANFAN_OCR_ENABLED=true` and `QIANFAN_OCR_API_URL=http://mimirq-qianfanocr:2090/convert` in the root .env.
  mimirq-qianfanocr:
    profiles: ["qianfanocr"]
    build:
      context: ./qianfanocr
    restart: unless-stopped
    hostname: mimirq-qianfanocr
    ports:
      - "2090:2090"
    environment:
      TZ: Asia/Shanghai
      # OpenAI-compatible upstream endpoint, e.g. http://host.docker.internal:8000/v1
      QIANFAN_OCR_SERVER_URL: ${QIANFAN_OCR_SERVER_URL:-}
      QIANFAN_OCR_SERVER_API_KEY: ${QIANFAN_OCR_SERVER_API_KEY:-}
      QIANFAN_OCR_MODEL: ${QIANFAN_OCR_MODEL:-baidu/Qianfan-OCR}
      QIANFAN_OCR_MAX_CONCURRENT_JOBS: ${QIANFAN_OCR_MAX_CONCURRENT_JOBS:-1}
      QIANFAN_OCR_PAGE_CONCURRENCY: ${QIANFAN_OCR_PAGE_CONCURRENCY:-1}
      QIANFAN_OCR_REQUEST_TIMEOUT_SEC: ${QIANFAN_OCR_REQUEST_TIMEOUT_SEC:-120}
      QIANFAN_OCR_PDF_DPI: ${QIANFAN_OCR_PDF_DPI:-200}
      QIANFAN_OCR_LAYOUT_AS_THOUGHT: ${QIANFAN_OCR_LAYOUT_AS_THOUGHT:-false}
      QIANFAN_OCR_LAYOUT_TRIGGER: ${QIANFAN_OCR_LAYOUT_TRIGGER:-}
      QIANFAN_OCR_PROMPT: ${QIANFAN_OCR_PROMPT:-}
    networks:
      default:
        aliases:
          - mimirq-qianfanocr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:2090/health').read()",
        ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  marker_cache:
  paddlevl_cache:
  mineru_cache:
  olmocr_cache:
