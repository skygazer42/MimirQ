{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mimirq.fullname" . }}
  labels:
    {{- include "mimirq.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mimirq.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}

