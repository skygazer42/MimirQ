# Example: production-ish Helm values for MimirQ.
#
# Usage:
#   helm upgrade --install mimirq deploy/helm/mimirq -n mimirq -f deploy/helm/mimirq/examples/values-prod.yaml

image:
  repository: "<your-registry>/mimirq"
  tag: "<tag>"

# Prefer creating this Secret outside Helm (Vault/ESO/KMS) and referencing it here.
existingSecretName: "mimirq-env"

api:
  replicas: 2
  # Multi-replica APIs must share rate-limit state. Use Postgres lexical
  # retrieval to avoid rebuilding the same in-memory BM25 index in every pod.
  extraEnv:
    - name: RATE_LIMIT_REDIS_ENABLED
      value: "true"
    - name: BM25_INDEX_ENABLED
      value: "false"

worker:
  replicas: 2

persistence:
  uploads:
    enabled: true
    size: 50Gi

prometheus:
  serviceMonitor:
    enabled: true
