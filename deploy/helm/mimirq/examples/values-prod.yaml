# Example: production-ish Helm values for MimirQ.
#
# Usage:
#   helm upgrade --install mimirq deploy/helm/mimirq -n mimirq -f deploy/helm/mimirq/examples/values-prod.yaml

image:
  repository: "<your-registry>/mimirq"
  tag: "<tag>"

# Prefer creating this Secret outside Helm (Vault/ESO/KMS) and referencing it here.
existingSecretName: "mimirq-env"

api:
  replicas: 2
  # Multi-replica APIs must share rate-limit state. Use Postgres lexical
  # retrieval to avoid rebuilding the same in-memory BM25 index in every pod.
  extraEnv:
    - name: ENV
      value: "production"
    - name: DB_CREATE_ALL_ON_STARTUP
      value: "false"
    - name: DB_RUNTIME_MIGRATIONS_ENABLED
      value: "false"
    - name: RATE_LIMIT_REDIS_ENABLED
      value: "true"
    - name: BM25_INDEX_ENABLED
      value: "false"

worker:
  replicas: 2
  extraEnv:
    - name: ENV
      value: "production"
    - name: DB_CREATE_ALL_ON_STARTUP
      value: "false"
    - name: DB_RUNTIME_MIGRATIONS_ENABLED
      value: "false"

# Validation hints for the chart. Keep these aligned with the external Secret.
runtimeGuards:
  environment: "production"
  vectorBackend: "milvus"
  minioEnabled: "true"
  minioDocumentsEnabled: "true"
  dbCreateAllOnStartup: "false"
  dbRuntimeMigrationsEnabled: "false"

persistence:
  uploads:
    enabled: true
    size: 50Gi

migrations:
  enabled: true

prometheus:
  serviceMonitor:
    enabled: true
