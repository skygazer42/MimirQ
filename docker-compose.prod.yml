x-backend-build: &backend_build
  context: .
  dockerfile: Dockerfile
  args:
    # Optional build metadata (exposed via /api/v1/meta)
    MIMIRQ_BUILD_SHA: ${MIMIRQ_BUILD_SHA:-}
    MIMIRQ_BUILD_TIME: ${MIMIRQ_BUILD_TIME:-}

x-backend-env: &backend_env
  PYTHONDONTWRITEBYTECODE: 1
  # Production guardrails (app/core/config.py validates these)
  ENV: production
  AUTH_MODE: jwt
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (min 32 chars)}
  # Container-to-container endpoints
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-mimirq}
  MILVUS_HOST: ${MILVUS_HOST_DOCKER:-milvus}
  MILVUS_PORT: ${MILVUS_PORT_DOCKER:-19530}
  UPLOAD_DIR: ${UPLOAD_DIR_DOCKER:-/data/uploads}
  # Optional: enable backend MinIO for images (Milvus still uses MinIO internally)
  MINIO_ENABLED: ${APP_MINIO_ENABLED:-false}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT_DOCKER:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME_DOCKER:-mimirq}
  MINIO_USE_SSL: ${MINIO_USE_SSL_DOCKER:-false}
  # CORS (frontend)
  CORS_ORIGINS: ${CORS_ORIGINS_DOCKER:-http://localhost:3000,http://localhost:3001}
  # Task queue
  TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED_DOCKER:-true}
  REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME_DOCKER:-mimirq}
  TASK_WORKER_MAX_JOBS: ${TASK_WORKER_MAX_JOBS_DOCKER:-10}

services:
  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimirq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCDCTL_API=3
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.5
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  backend:
    build: *backend_build
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *backend_env
      UVICORN_WORKERS: ${BACKEND_WORKERS:-2}
    volumes:
      - upload_data:/data/uploads

  worker:
    build: *backend_build
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *backend_env
    volumes:
      - upload_data:/data/uploads
    command: arq app.tasks.worker.WorkerSettings

  web:
    profiles: ["web"]
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-60000}
        NEXT_PUBLIC_USER_ID: ${NEXT_PUBLIC_USER_ID:-demo}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-00000000-0000-0000-0000-000000000000}
        MIMIRQ_BUILD_SHA: ${MIMIRQ_BUILD_SHA:-}
        MIMIRQ_BUILD_TIME: ${MIMIRQ_BUILD_TIME:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  upload_data:

