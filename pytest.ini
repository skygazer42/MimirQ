[pytest]
addopts = -ra
testpaths = tests

# Keep local test output readable by filtering common third-party warnings.
# We avoid hiding project warnings by targeting specific messages/modules.
filterwarnings =
    ignore:pkg_resources is deprecated as an API\..*:UserWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace.*:DeprecationWarning
    ignore:`torch\.utils\._pytree\._register_pytree_node` is deprecated\..*:FutureWarning
    ignore:The pynvml package is deprecated\..*:FutureWarning
    ignore:numpy\.core\._multiarray_umath is deprecated.*:DeprecationWarning
    ignore:The class `Milvus` was deprecated in LangChain 0\.2\.0.*:DeprecationWarning
    ignore:.*SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:.*SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:.*swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:'BaseCommand' is deprecated and will be removed in Click 9\.0\..*:DeprecationWarning
    ignore:Importing 'parser\.split_arg_string' is deprecated.*:DeprecationWarning
    # Some unit tests explicitly exercise AUTH_MODE=header; keep its warning in app startup logs/docs.
    ignore:Using default SECRET_KEY\. Change this in production!:UserWarning
