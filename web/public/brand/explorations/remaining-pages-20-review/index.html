t-before.png", "desktop": "assets/audit-desktop.png", "narrow-dark": "assets/audit-narrow-dark.png", "phone": "assets/audit-phone.png"}, "note": "填充内容来自隔离接口；从知识库选择已有文档，再进入文档健康审计。", "liveLabel": "在知识库选择文档 ↗"}, {"id": "observability", "name": "可观测性", "route": "/observability", "images": {"before": "assets/observability-before.png", "desktop": "assets/observability-desktop.png", "narrow-dark": "assets/observability-narrow-dark.png", "phone": "assets/observability-phone.png"}}, {"id": "evidence", "name": "证据调试", "route": "/knowledge/evidence", "images": {"before": "assets/evidence-before.png", "desktop": "assets/evidence-desktop.png", "narrow-dark": "assets/evidence-narrow-dark.png", "phone": "assets/evidence-phone.png"}}, {"id": "nebula", "name": "语义星云", "route": "/knowledge/nebula", "images": {"before": "assets/nebula-before.png", "desktop": "assets/nebula-desktop.png", "narrow-dark": "assets/nebula-narrow-dark.png", "phone": "assets/nebula-phone.png"}}, {"id": "oidc", "name": "OIDC回调", "route": "/auth/oidc/callback", "images": {"before": "assets/oidc-before.png", "desktop": "assets/oidc-desktop.png", "narrow-dark": "assets/oidc-narrow-dark.png", "phone": "assets/oidc-phone.png"}, "note": "此入口展示缺少有效授权会话时的恢复状态；真实登录应从平台的 SSO 入口发起。", "liveLabel": "查看认证恢复入口 ↗"}, {"id": "saml", "name": "SAML回调", "route": "/auth/saml/callback?error=saml_session_missing", "images": {"before": "assets/saml-before.png", "desktop": "assets/saml-desktop.png", "narrow-dark": "assets/saml-narrow-dark.png", "phone": "assets/saml-phone.png"}, "note": "此入口展示缺少有效授权会话时的恢复状态；真实登录应从平台的 SSO 入口发起。", "liveLabel": "查看认证恢复入口 ↗"}];
let selected = pages[0], mode = 'compare';
const nav = document.querySelector('#navigation');
for (const [i, page] of pages.entries()) {
  const button = document.createElement('button');
  button.textContent = String(i + 1).padStart(2, '0') + ' ' + page.name;
  button.dataset.page = page.id;
  button.onclick = () => { selected = page; mode = 'compare'; render(); };
  nav.append(button);
}
for (const button of document.querySelectorAll('[data-mode]')) {
  button.onclick = () => { mode = button.dataset.mode; render(); };
}
function render() {
  document.querySelector('#title').textContent = selected.name;
  document.querySelector('#live').href = selected.route;
  document.querySelector('#live').textContent = selected.liveLabel || '打开正式页面 ↗';
  document.querySelector('#before').src = selected.images.before;
  const source = selected.images[mode === 'compare' ? 'desktop' : mode];
  document.querySelector('#after').src = source;
  document.querySelector('#full').href = source;
  document.querySelector('#caption').textContent = mode === 'phone' ? '新版 · 手机' : mode === 'narrow-dark' ? '新版 · 深色窄屏' : '新版 · 桌面';
  document.querySelector('#current').className = 'mode-' + mode;
  document.querySelector('article').classList.toggle('single', mode !== 'compare');
  document.querySelector('#note').textContent = selected.note || '';
  for (const button of nav.children) button.setAttribute('aria-current', String(button.dataset.page === selected.id));
  for (const button of document.querySelectorAll('[data-mode]')) {
    button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
    button.disabled = button.dataset.mode !== 'compare' && !selected.images[button.dataset.mode];
  }
}
render();
</script></html>
