<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="form-action 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Ragvia · 登录页设计</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/ragvia-ui-sc.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Ragvia UI";src:url("fonts/ragvia-ui-sc.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:light;--ink:#20262e;--muted:#606a75;--fog:#f6f7f8;--rust:#b84a2a;--edge:#87929d;--error:#a62d32;--ease:cubic-bezier(.2,.7,.3,1);--fast:160ms}
html{scrollbar-gutter:stable both-edges;background:var(--fog)}
*{box-sizing:border-box}
body{margin:0;background:var(--fog);color:var(--ink);font-family:"Ragvia UI","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,summary{font:inherit}
button,summary{-webkit-tap-highlight-color:transparent}
.scene{position:relative;min-height:100dvh;padding:max(88px,calc((100dvh - 532px)/2)) 24px 56px;isolation:isolate;overflow:hidden}
.backdrop{position:absolute;inset:0;z-index:-1;pointer-events:none;--px:0px;--py:0px}
.backdrop>svg{position:absolute;inset:0;width:100%;height:100%}
.backdrop .backdrop-mobile,.backdrop .backdrop-short{display:none}
.login-card{width:min(432px,100%);margin:0 auto;padding:32px 36px 20px;background:#fff;border:1px solid #e1e5e8;border-radius:20px;box-shadow:0 2px 4px #20262e03,0 16px 48px -20px #20262e1c;animation:auth-entrance 500ms var(--ease) both}
.brand{width:144px;height:44px;margin:0 auto;display:block}
.brand svg{width:100%;height:100%;display:block}
.heading{display:grid;justify-items:center;gap:6px;text-align:center;margin-top:24px}
h1{font-size:26px;font-weight:550;line-height:36px;letter-spacing:0;margin:0}
.subtitle{font-size:14px;font-weight:400;line-height:24px;color:var(--muted);margin:0}
.login-form{margin-top:28px}
.field:not([hidden])~.field:not([hidden]){margin-top:20px}
label{display:block;font-size:14px;font-weight:500;line-height:22px;margin-bottom:8px}
.control{position:relative}
.input-icon{position:absolute;top:15px;left:14px;width:20px;height:20px;color:var(--muted);pointer-events:none;transition:color var(--fast) ease}
input{display:block;min-width:0;width:100%;height:50px;border:1px solid var(--edge);border-radius:9px;background:#fff;color:var(--ink);padding:0 14px 0 42px;font-size:16px;line-height:24px;outline:none;transition:border-color var(--fast) ease,box-shadow var(--fast) ease}
input::placeholder{color:var(--muted);opacity:1}
input:hover{border-color:var(--muted)}
input:focus{border-color:var(--rust);box-shadow:0 0 0 3px #b84a2a14}
.control:focus-within .input-icon{color:var(--rust)}
input[aria-invalid=true]{border-color:var(--error)}
input[aria-invalid=true]:focus{box-shadow:0 0 0 3px #a62d3214}
input[type=password],input.password-visible{padding-right:50px}
.reveal{position:absolute;right:3px;top:3px;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:6px;color:var(--muted);cursor:pointer;transition:color var(--fast) ease,background var(--fast) ease}
.reveal:hover{color:var(--ink);background:#f2f4f5}
.reveal svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.reveal .eye-slash{display:none}
.reveal[aria-pressed=true] .eye-slash{display:block}
.error{font-size:13px;line-height:20px;color:var(--error);margin:6px 0 0}
.preview-status{margin:16px 0 0;color:var(--muted);font-size:14px;line-height:24px}
.preview-status a{color:var(--rust);text-underline-offset:4px}
[hidden]{display:none}
.submit{width:100%;height:50px;margin-top:24px;background:var(--rust);border:1px solid #a14125;border-radius:9px;color:white;font-size:16px;line-height:24px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px #7c301e14;transition:background var(--fast) ease,transform 100ms ease,box-shadow var(--fast) ease}
.submit:hover{background:#a34126;box-shadow:0 3px 8px #7c301e1f}
.submit:active{transform:translateY(1px);box-shadow:none}
.account-switch{margin:20px 0 0;min-height:44px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;line-height:22px;color:var(--muted)}
.mode-switch{min-height:44px;padding:0 4px;border:0;border-radius:4px;background:transparent;color:var(--rust);font-weight:600;cursor:pointer;text-underline-offset:4px;transition:color var(--fast) ease}
.mode-switch:hover{color:#963b22;text-decoration:underline}
.back{position:absolute;z-index:2;top:24px;left:28px;display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;line-height:44px;text-decoration:none;transition:color var(--fast) ease}
.back span{display:inline-block;transition:transform var(--fast) ease}
.back:hover span{transform:translateX(-2px)}
.back:hover{color:var(--ink)}
.back:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--rust);outline-offset:4px}
.field-assemble{animation:field-assemble 2800ms cubic-bezier(.18,.7,.22,1) var(--delay) both}
.field-parallax-left{transform:translate(var(--px),var(--py));transition:transform 850ms cubic-bezier(.2,.7,.3,1)}
.field-parallax-right{transform:translate(calc(var(--px) * -.65),calc(var(--py) * -.65));transition:transform 850ms cubic-bezier(.2,.7,.3,1)}
.page-hidden .field-assemble{animation-play-state:paused}
.motion-settled .field-assemble{animation:none}
@keyframes field-assemble{from{opacity:0;transform:translate(var(--enter-x),var(--enter-y))}30%{opacity:1}to{opacity:1;transform:translate(0,0)}}
@keyframes auth-entrance{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){.scene{padding:max(80px,calc((100dvh - 524px)/2 + 8px)) 16px 64px}.login-card{padding:28px 20px 16px;border-radius:18px}.back{left:20px;top:12px}.backdrop .backdrop-wide{display:none}.backdrop .backdrop-mobile{display:block}}
@media(max-width:620px) and (max-height:700px){.backdrop .backdrop-mobile{display:none}.backdrop .backdrop-short{display:block}}
@media(prefers-reduced-motion:reduce){.login-card,.field-assemble{animation:none}.field-parallax-left,.field-parallax-right{transform:none;transition:none}input,button,.input-icon,.back,.back span{transition:none}.back:hover span,.submit:active{transform:none}}
</style>
</head>

<header class="heading"><h1 id="login-heading" tabindex="-1">欢迎回来</h1><p class="subtitle">登录 Ragvia</p></header>
<form id="auth-form" class="login-form" novalidate>
<div class="field" data-register hidden><label for="email">邮箱</label><div class="control">
<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
<input id="email" type="email" autocomplete="email" placeholder="请输入邮箱" required disabled aria-describedby="email-error"></div><p class="error" id="email-error" hidden></p></div>
<div class="field"><label for="username" id="username-label">用户名或邮箱</label><div class="control">
<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 20v-2.5a6.5 6.5 0 0 1 13 0V20"/></svg>
<input id="username" type="text" autocomplete="username" placeholder="请输入用户名或邮箱" required aria-describedby="username-error"></div><p class="error" id="username-error" hidden>请输入用户名或邮箱</p></div>
<div class="field"><label for="password">密码</label><div class="control">
<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
<input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required aria-describedby="password-error">
<button class="reveal" type="button" aria-label="显示密码" aria-pressed="false" aria-controls="password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 3 16 18"/></svg></button>
</div><p class="error" id="password-error" hidden>请输入密码</p></div>
<div class="field" data-register hidden><label for="confirm-password">确认密码</label><div class="control">
<svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
<input id="confirm-password" type="password" autocomplete="new-password" placeholder="请再次输入密码" required disabled aria-describedby="confirm-password-error"></div><p class="error" id="confirm-password-error" hidden></p></div>
<button class="submit" type="submit">登录</button>
<p id="preview-status" class="preview-status" role="status" tabindex="-1" hidden>这是设计预览，请到正式入口完成操作。<a id="preview-auth-link" href="/auth">前往登录</a></p>
</form>
<p class="account-switch"><span id="account-prompt">还没有账号？</span><button id="mode-switch" class="mode-switch" type="button" aria-controls="auth-form">注册</button></p>
</section>
</main>
<script>
const scene=document.querySelector('.scene');
const backdrop=document.querySelector('.backdrop');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
const finePointer=window.matchMedia('(hover: hover) and (pointer: fine)');
let pointerFrame=0;
let pointerX=0,pointerY=0;
function paintPointer(){pointerFrame=0;backdrop.style.setProperty('--px',pointerX.toFixed(2)+'px');backdrop.style.setProperty('--py',pointerY.toFixed(2)+'px')}
function resetPointer(){pointerX=pointerY=0;if(pointerFrame){cancelAnimationFrame(pointerFrame);pointerFrame=0}paintPointer()}
scene.addEventListener('pointermove',event=>{if(reduce.matches||!finePointer.matches||document.hidden)return;pointerX=(event.clientX/window.innerWidth-.5)*16;pointerY=(event.clientY/window.innerHeight-.5)*12;if(!pointerFrame)pointerFrame=requestAnimationFrame(paintPointer)},{passive:true});
scene.addEventListener('pointerleave',resetPointer);
reduce.addEventListener('change',resetPointer);
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('page-hidden',document.hidden);if(document.hidden)resetPointer()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){resetPointer();document.documentElement.classList.add('motion-settled')}});
window.addEventListener('pagehide',resetPointer);
// This independent design preview never sends, logs or stores credentials.
const form=document.querySelector('.login-form');
const inputs=Array.from(form.querySelectorAll('input'));
const password=document.getElementById('password');
const confirmPassword=document.getElementById('confirm-password');
const reveal=document.querySelector('.reveal');
let registering=false;
function validate(input){
  let message='';
  const empty=input.id==='password'||input.id==='confirm-password'?!input.value:!input.value.trim();
  if(empty)message=input.id==='username'?(registering?'请输入用户名':'请输入用户名或邮箱'):input.id==='email'?'请输入邮箱':input.id==='confirm-password'?'请再次输入密码':'请输入密码';
  else if(input.id==='email'&&input.validity.typeMismatch)message='请输入有效的邮箱地址';
  else if(registering&&input.id==='username'&&(input.value.trim().length<3||input.value.trim().length>64))message='用户名需要 3–64 个字符';
  else if(registering&&input.id==='password'&&input.value.length<8)message='密码至少需要 8 个字符';
  else if(registering&&input.id==='password'&&new TextEncoder().encode(input.value).length>72)message='密码不能超过 72 字节';
  else if(input.id==='confirm-password'&&input.value!==password.value)message='两次输入的密码不一致';
  input.setAttribute('aria-invalid',String(Boolean(message)));
  const error=document.getElementById(input.id+'-error');error.textContent=message;error.hidden=!message;
  return !message;
}
inputs.forEach(input=>{
  input.addEventListener('blur',()=>{if(input.value||input.hasAttribute('aria-invalid'))validate(input)});
  input.addEventListener('input',()=>{
    if(input.getAttribute('aria-invalid')==='true')validate(input);
    if(input===password&&!confirmPassword.disabled&&confirmPassword.getAttribute('aria-invalid')==='true')validate(confirmPassword);
  });
});
form.addEventListener('submit',event=>{
  event.preventDefault();
  const invalid=inputs.filter(input=>!input.disabled&&!validate(input));
  if(invalid.length){invalid[0].focus();return}
  const status=document.getElementById('preview-status');
  const link=document.getElementById('preview-auth-link');
  link.setAttribute('href',registering?'/auth?mode=register':'/auth');
  link.textContent=registering?'前往注册':'前往登录';
  status.hidden=false;status.focus();
});
reveal.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';password.classList.toggle('password-visible',show);reveal.setAttribute('aria-pressed',String(show));reveal.setAttribute('aria-label',show?'隐藏密码':'显示密码')});
document.getElementById('mode-switch').addEventListener('click',()=>{
  registering=!registering;
  document.getElementById('preview-status').hidden=true;
  document.querySelectorAll('[data-register]').forEach(field=>{field.hidden=!registering;field.querySelectorAll('input').forEach(input=>input.disabled=!registering)});
  document.getElementById('login-heading').textContent=registering?'创建账号':'欢迎回来';
  document.querySelector('.subtitle').textContent=registering?'使用邮箱注册':'登录 Ragvia';
  document.getElementById('username-label').textContent=registering?'用户名':'用户名或邮箱';
  document.getElementById('username').placeholder=registering?'请输入用户名':'请输入用户名或邮箱';
  password.autocomplete=registering?'new-password':'current-password';
  password.value=confirmPassword.value='';password.type='password';password.classList.remove('password-visible');
  reveal.setAttribute('aria-pressed','false');reveal.setAttribute('aria-label','显示密码');
  form.querySelector('.submit').textContent=registering?'注册':'登录';
  document.getElementById('account-prompt').textContent=registering?'已有账号？':'还没有账号？';
  document.getElementById('mode-switch').textContent=registering?'登录':'注册';
  inputs.forEach(input=>{input.removeAttribute('aria-invalid');document.getElementById(input.id+'-error').hidden=true});
  document.getElementById('login-heading').focus();
});
</script>
</body>
</html>
