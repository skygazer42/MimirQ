<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>原序 · 晴水翠鸟</title><link rel="icon" href="assets/kingfisher-app.svg" type="image/svg+xml">
<style>
@font-face{font-family:Yuanxu;src:url('assets/study-sans.woff2') format('woff2');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:900px}body{font-family:Yuanxu,'Microsoft YaHei',sans-serif;color:#123d57;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #087aab;outline-offset:4px}.canvas{display:grid;grid-template-columns:560px 720px;width:1280px;height:900px;overflow:hidden}.entry{position:relative;background:#fff}.brand-lockup{display:flex;align-items:center;gap:12px;position:absolute;left:49px;top:38px}.brand-lockup img{width:43px;height:43px}.brand-name{font-size:27px;font-weight:450;letter-spacing:2px;line-height:34px}.latin{font-family:Georgia,serif;font-size:10px;letter-spacing:2.5px;color:#507b90;line-height:17px}.form-wrap{width:344px;position:absolute;left:108px;top:209px}.form-wrap h1{margin:0;font-weight:400;font-size:34px;line-height:48px;letter-spacing:.3px}.form-wrap .lead{font-size:14px;line-height:24px;margin:8px 0 27px;color:#657f8d}.modes{height:40px;display:flex;gap:30px;align-items:flex-start;border-bottom:1px solid #dce8ed;margin-bottom:27px}.modes button{font-size:14px;border:0;background:none;padding:0 0 14px;color:#728793;position:relative}.modes button.active{color:#087aab;font-weight:500}.modes .active:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#087aab}.field{margin-bottom:23px}.field label{font-size:14px;line-height:23px;display:block;margin-bottom:8px;font-weight:450}.field input{width:100%;height:49px;border:1px solid #c8dce5;border-radius:6px;background:#fff;padding:0 14px;color:#123d57;font-size:15px}.field input::placeholder{color:#81949e;opacity:1}.password-box{position:relative}.password-box input{padding-right:47px}.eye{width:19px;height:19px;position:absolute;right:15px;top:15px;color:#7893a0}.submit{display:flex;align-items:center;justify-content:space-between;background:#087aab;color:#fff;width:100%;height:49px;border:0;border-radius:6px;padding:0 18px;font-size:15px;margin-top:29px}.submit svg{width:19px;height:19px}.help{font-size:13px;line-height:24px;color:#6d8490;margin-top:26px}.contact{padding:4px 0;border:0;background:none;font-size:14px;color:#285e77;text-decoration:underline;text-underline-offset:5px}.scene{position:relative;background:#087aab;overflow:hidden}.hero-mark{position:absolute;width:354px;height:354px;left:182px;top:145px}.bank{position:absolute;bottom:0;left:0;right:0;height:271px;background:#bddfae}.brand-line{position:absolute;left:70px;bottom:111px;font-size:36px;font-weight:400;line-height:1.45;letter-spacing:.5px;margin:0;color:#174c59}.brand-line span{display:block}.capabilities{position:absolute;left:72px;bottom:47px;font-size:14px;letter-spacing:.6px;color:#3f6971}.small-caption{position:absolute;left:48px;bottom:35px;font-size:12px;color:#6b8796}
</style>
</head>
<body><main class="canvas">
  <section class="entry" aria-labelledby="auth-title">
    <header class="brand-lockup"><img src="assets/kingfisher.svg" alt=""><div><div class="brand-name">原序</div><div class="latin">YUANXU</div></div></header>
    <div class="form-wrap">
      <h1 id="auth-title">欢迎回来</h1><p class="lead">登录原序，继续探索你的知识库。</p>
      <div class="modes" aria-label="登录方式"><button class="active" type="button" aria-pressed="true">登录</button><button type="button" aria-pressed="false">首次设置</button></div>
      <form aria-label="账号登录">
        <div class="field"><label for="account">账号</label><input id="account" placeholder="输入邮箱或用户名" readonly autocomplete="off"></div>
        <div class="field"><label for="password">密码</label><div class="password-box"><input id="password" type="password" placeholder="请输入密码" readonly autocomplete="off"><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></div></div>
        <button class="submit" type="button"><span>登录</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <div class="help">无法登录或需要开通账号？<br><button type="button" class="contact">联系管理员</button></div>
    </div>
  </section>
  <aside class="scene" aria-label="关于原序"><img class="hero-mark" src="assets/kingfisher-inverse.svg" alt="侧身翠鸟标志"><div class="bank" aria-hidden="true"></div><h2 class="brand-line"><span>从原始资料，</span><span>到可信答案。</span></h2><div class="capabilities">文档 · 知识库 · 来源追溯</div></aside>
</main></body></html>
