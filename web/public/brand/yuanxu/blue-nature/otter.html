<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>原序 · 蓝湾海獭</title><link rel="icon" href="assets/otter-app.svg" type="image/svg+xml">
<style>
@font-face{font-family:Yuanxu;src:url('assets/study-sans.woff2') format('woff2');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:900px}body{font-family:Yuanxu,'Microsoft YaHei',sans-serif;color:#183e65;background:#f5fafd;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #2865ad;outline-offset:4px}.canvas{width:1280px;height:900px;position:relative;overflow:hidden}.center{position:relative;width:360px;margin:0 auto;z-index:2;padding-top:38px}.brand-stack{text-align:center}.brand-stack img{display:block;width:83px;height:83px;margin:0 auto}.brand-name{font-size:31px;font-weight:650;letter-spacing:3px;line-height:42px;margin-top:2px}.latin{font-family:'Segoe UI',Arial,sans-serif;font-size:10px;letter-spacing:3px;color:#5c7e9e;margin-top:3px}.intro{text-align:center;margin-top:26px}.intro h1{font-size:27px;font-weight:550;line-height:38px;margin:0}.intro p{font-size:14px;color:#627e96;line-height:24px;margin:7px 0 0}.modes{display:flex;justify-content:center;gap:36px;margin:25px 0 25px;height:38px;border-bottom:1px solid #d7e4ee}.modes button{border:0;background:none;padding:0 3px 11px;color:#71879a;font-size:14px;position:relative}.modes .active{font-weight:550;color:#2865ad}.modes .active:after{content:'';height:3px;border-radius:2px;background:#2865ad;position:absolute;left:0;right:0;bottom:-1px}.field{margin-bottom:20px}.field label{display:block;font-size:14px;font-weight:500;line-height:22px;margin-bottom:8px}.field input{width:100%;height:50px;border:1px solid #caddec;border-radius:12px;padding:0 15px;font-size:15px;color:#183e65;background:#fff}.field input::placeholder{color:#8194a5;opacity:1}.password-box{position:relative}.password-box input{padding-right:49px}.eye{position:absolute;right:16px;top:15px;width:20px;height:20px;color:#7892a8}.submit{height:50px;width:100%;border:0;border-radius:12px;background:#2865ad;color:white;font-size:15px;font-weight:550;margin-top:7px;box-shadow:0 4px 10px #2865ad12}.help{text-align:center;font-size:13px;color:#6c8295;margin-top:21px;line-height:24px}.contact{background:none;border:0;padding:4px 0;font-size:14px;color:#365f88;text-decoration:underline;text-underline-offset:5px}.bay{position:absolute;left:0;right:0;bottom:0;height:139px;background:#2865ad}.shoreline{position:absolute;left:0;right:0;bottom:139px;height:4px;background:#bfdccf}.bay-copy{position:absolute;left:69px;bottom:48px;color:#fff}.bay-copy .tagline{font-size:25px;font-weight:450;line-height:36px;letter-spacing:.4px}.bay-copy .capabilities{font-size:13px;line-height:23px;color:#e2edfa;margin-top:9px}.bay-mark{width:134px;height:134px;position:absolute;bottom:2px;right:84px}.flank-wordmark{position:absolute;left:46px;top:40px;font-size:13px;letter-spacing:1px;color:#587995}
</style>
</head>
<body><main class="canvas">
  <div class="flank-wordmark">原序知识库</div>
  <section class="center" aria-labelledby="auth-title">
    <header class="brand-stack"><img src="assets/otter.svg" alt="海獭标志"><div class="brand-name">原序</div><div class="latin">YUANXU</div></header>
    <div class="intro"><h1 id="auth-title">欢迎回来</h1><p>登录原序，继续探索你的知识库。</p></div>
    <div class="modes" aria-label="登录方式"><button type="button" class="active" aria-pressed="true">登录</button><button type="button" aria-pressed="false">首次设置</button></div>
    <form aria-label="账号登录">
      <div class="field"><label for="account">账号</label><input id="account" placeholder="输入邮箱或用户名" readonly autocomplete="off"></div>
      <div class="field"><label for="password">密码</label><div class="password-box"><input id="password" type="password" placeholder="请输入密码" readonly autocomplete="off"><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></div></div>
      <button class="submit" type="button">登录</button>
    </form>
    <div class="help">无法登录或需要开通账号？<br><button class="contact" type="button">联系管理员</button></div>
  </section>
  <div class="shoreline" aria-hidden="true"></div><div class="bay" aria-hidden="true"></div>
  <div class="bay-copy"><div class="tagline">从原始资料，到可信答案。</div><div class="capabilities">文档 · 知识库 · 来源追溯</div></div>
  <img class="bay-mark" src="assets/otter-inverse.svg" alt="">
</main></body></html>
