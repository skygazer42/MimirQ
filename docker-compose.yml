version: '3.8'

x-backend-build: &backend_build
  context: .
  dockerfile: Dockerfile
  args:
    # Default to minimal deps for smaller/faster Docker builds.
    # Override if you need heavy optional parsers/local embeddings:
    #   BACKEND_REQUIREMENTS_FILE=requirements.txt
    REQUIREMENTS_FILE: ${BACKEND_REQUIREMENTS_FILE:-requirements-minimal.txt}

x-backend-env: &backend_env
  PYTHONDONTWRITEBYTECODE: 1
  # Force container-to-container endpoints (do not depend on host-local `.env` defaults like localhost).
  DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@postgres:5432/mimirq}
  MILVUS_HOST: ${MILVUS_HOST_DOCKER:-milvus}
  MILVUS_PORT: ${MILVUS_PORT_DOCKER:-19530}
  # Persisted data dirs (mounted as volumes; avoid coupling to /app code mounts).
  UPLOAD_DIR: ${UPLOAD_DIR_DOCKER:-/data/uploads}
  # MinIO for images
  MINIO_ENABLED: ${MINIO_ENABLED_DOCKER:-true}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT_DOCKER:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME_DOCKER:-mimirq}
  MINIO_USE_SSL: ${MINIO_USE_SSL_DOCKER:-false}
  # MinerU 本地 ZIP 模式（如未使用可留空）
  MINERU_LOCAL_SERVER_URL: ${MINERU_LOCAL_SERVER_URL_DOCKER:-}
  MINERU_VL_SERVER: ${MINERU_VL_SERVER_DOCKER:-}
  # CORS (frontend)
  CORS_ORIGINS: ${CORS_ORIGINS_DOCKER:-http://localhost:3000,http://localhost:3001}
  # Task queue
  TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED_DOCKER:-true}
  REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME_DOCKER:-mimirq}
  TASK_WORKER_MAX_JOBS: ${TASK_WORKER_MAX_JOBS_DOCKER:-10}

services:
  # Redis（任务队列/缓存/幂等锁）
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: mimirq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus Etcd (元数据存储)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCDCTL_API=3
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus MinIO (对象存储)
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      # Modern env names (also keep the old ones for compatibility with older images).
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_DOCKER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_DOCKER:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 向量数据库
  milvus:
    image: milvusdb/milvus:v2.3.5
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # FastAPI 后端
  backend:
    build: *backend_build
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *backend_env
    volumes:
      - upload_data:/data/uploads

  # Arq worker（后台处理文档解析/索引）
  worker:
    build: *backend_build
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *backend_env
    volumes:
      - upload_data:/data/uploads
    command: arq app.tasks.worker.WorkerSettings

  # Next.js 前端（生产构建）
  web:
    profiles: ["web"]
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-60000}
        NEXT_PUBLIC_USER_ID: ${NEXT_PUBLIC_USER_ID:-demo}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-00000000-0000-0000-0000-000000000000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  upload_data:
