[alembic]
# Alembic migration configuration.
#
# Notes:
# - `sqlalchemy.url` is overridden by `alembic/env.py` via `settings.DATABASE_URL`
#   (or DATABASE_URL env var as fallback).
# - Keep this file checked-in so `make db-upgrade` / `make db-revision` works out
#   of the box.
script_location = alembic

# Fallback URL used when app settings are not importable (e.g. in constrained tooling).
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/mimirq


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

