<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="800" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="160" rx="16" fill="url(#bannerBg)"/>

  <!-- Decorative orb -->
  <circle cx="130" cy="80" r="38" fill="#6366f1" opacity="0.12"/>
  <circle cx="130" cy="80" r="24" fill="#6366f1" opacity="0.18"/>
  <!-- Mímir's well symbol -->
  <path d="M118 68 L130 56 L142 68" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M115 80 Q130 96 145 80" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="130" cy="76" r="3.5" fill="#c4b5fd"/>
  <path d="M126 84 L130 92 L134 84" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

  <!-- Logo text -->
  <text x="180" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="url(#logoGrad)" letter-spacing="-1">MimirQ</text>

  <!-- Tagline -->
  <text x="182" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="3" font-weight="500">OPEN-SOURCE RAG KNOWLEDGE BASE</text>

  <!-- Accent line -->
  <line x1="100" y1="134" x2="700" y2="134" stroke="url(#accentLine)" stroke-width="1.5"/>

  <!-- Right side decorative dots -->
  <circle cx="640" cy="50" r="2" fill="#6366f1" opacity="0.3"/>
  <circle cx="660" cy="42" r="1.5" fill="#a855f7" opacity="0.25"/>
  <circle cx="680" cy="55" r="2.5" fill="#6366f1" opacity="0.2"/>
  <circle cx="650" cy="65" r="1.5" fill="#c084fc" opacity="0.3"/>
  <circle cx="700" cy="48" r="2" fill="#818cf8" opacity="0.2"/>
  <circle cx="670" cy="72" r="1" fill="#a855f7" opacity="0.35"/>
</svg>
