<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">MimirQ — Observable RAG infrastructure</title>
  <desc id="desc">MimirQ turns document parsing, governance, retrieval, reranking, citations, and evaluation into an inspectable knowledge pipeline.</desc>

  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="1160" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.56" stop-color="#0A1B2B"/>
      <stop offset="1" stop-color="#0B2634"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="72" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.52" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3C5"/>
    </linearGradient>
    <radialGradient id="quietGlow" cx="0" cy="0" r="1" gradientTransform="translate(1030 94) rotate(142) scale(430 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9BD9E5" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#background)"/>
  <rect width="1200" height="340" rx="26" fill="url(#quietGlow)"/>
  <path d="M650 0H1200V340H585C666 276 674 67 650 0Z" fill="url(#grid)"/>
  <path d="M630 42V298" stroke="#7DD3E8" stroke-opacity="0.13"/>

  <!-- Brand mark: the same M + orbital Q idea used by the product UI. -->
  <g transform="translate(54 44)">
    <circle cx="112" cy="126" r="78" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <path d="M164 181L199 216" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
    <path d="M72 169V86L112 126L152 86V169" fill="none" stroke="#EDF8FF" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="52" cy="76" r="9" fill="#2563EB" stroke="#07111F" stroke-width="5"/>
    <circle cx="190" cy="126" r="9" fill="#22D3C5" stroke="#07111F" stroke-width="5"/>
    <circle cx="52" cy="176" r="9" fill="#0EA5E9" stroke="#07111F" stroke-width="5"/>
  </g>

  <g transform="translate(270 58)">
    <text x="0" y="18" fill="#7DD3E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">OPEN-SOURCE RAG INFRASTRUCTURE</text>
    <text x="0" y="105" fill="#F2F9FC" font-family="Inter, Aptos, ui-sans-serif, system-ui, sans-serif" font-size="78" font-weight="760" letter-spacing="-4">MimirQ</text>
    <text x="2" y="150" fill="#B9D3DD" font-family="Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">把 RAG 黑盒变成可验证的知识流水线</text>
    <text x="2" y="184" fill="#7396A5" font-family="Noto Sans SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">解析 · 治理 · 检索 · 重排 · 引用 · 回归评测</text>
  </g>

  <g transform="translate(690 72)">
    <text x="0" y="16" fill="#7DD3E8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">OBSERVABLE KNOWLEDGE PIPELINE</text>
    <path d="M22 91H382" stroke="#2D6377" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 91H382" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="88 24"/>

    <g font-family="Inter, Aptos, ui-sans-serif, system-ui, sans-serif">
      <g transform="translate(22 91)">
        <circle r="11" fill="#0A1B2B" stroke="#2563EB" stroke-width="4"/>
        <text x="0" y="39" text-anchor="middle" fill="#E7F3F7" font-size="13" font-weight="700">Parse</text>
        <text x="0" y="59" text-anchor="middle" fill="#6F94A3" font-size="11">layout</text>
      </g>
      <g transform="translate(142 91)">
        <circle r="11" fill="#0A1B2B" stroke="#0EA5E9" stroke-width="4"/>
        <text x="0" y="39" text-anchor="middle" fill="#E7F3F7" font-size="13" font-weight="700">Govern</text>
        <text x="0" y="59" text-anchor="middle" fill="#6F94A3" font-size="11">policy</text>
      </g>
      <g transform="translate(262 91)">
        <circle r="11" fill="#0A1B2B" stroke="#14B8C8" stroke-width="4"/>
        <text x="0" y="39" text-anchor="middle" fill="#E7F3F7" font-size="13" font-weight="700">Retrieve</text>
        <text x="0" y="59" text-anchor="middle" fill="#6F94A3" font-size="11">evidence</text>
      </g>
      <g transform="translate(382 91)">
        <circle r="11" fill="#0A1B2B" stroke="#22D3C5" stroke-width="4"/>
        <text x="0" y="39" text-anchor="middle" fill="#E7F3F7" font-size="13" font-weight="700">Evaluate</text>
        <text x="0" y="59" text-anchor="middle" fill="#6F94A3" font-size="11">regress</text>
      </g>
    </g>

    <rect x="0" y="190" width="404" height="58" rx="12" fill="#0D2634" stroke="#245365"/>
    <circle cx="22" cy="219" r="5" fill="#22D3C5"/>
    <text x="38" y="214" fill="#CBE6EC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">evidence at every step</text>
    <text x="38" y="235" fill="#6E9CAB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">INSPECT · REPLACE · REGRESS</text>
  </g>
</svg>
