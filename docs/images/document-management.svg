<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="600" fill="#F8FAFC" />
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="40" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#1E293B">Documents</text>
  <rect x="650" y="30" width="120" height="40" rx="6" fill="#3B82F6" />
  <text x="710" y="55" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Upload File</text>

  <!-- Table Header -->
  <rect x="40" y="100" width="720" height="50" rx="4" fill="#F1F5F9" />
  <text x="60" y="130" font-family="Arial" font-size="14" fill="#64748B">Name</text>
  <text x="300" y="130" font-family="Arial" font-size="14" fill="#64748B">Status</text>
  <text x="450" y="130" font-family="Arial" font-size="14" fill="#64748B">Chunks</text>
  <text x="600" y="130" font-family="Arial" font-size="14" fill="#64748B">Date</text>

  <!-- Row 1 -->
  <rect x="40" y="160" width="720" height="60" rx="4" fill="white" stroke="#E2E8F0" />
  <rect x="60" y="180" width="20" height="20" rx="4" fill="#EF4444" opacity="0.2" /> <!-- PDF Icon -->
  <text x="90" y="195" font-family="Arial" font-size="14" fill="#334155">Employee_Handbook.pdf</text>
  <rect x="300" y="180" width="80" height="24" rx="12" fill="#DCFCE7" />
  <text x="340" y="196" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle">Indexed</text>
  <text x="450" y="195" font-family="Arial" font-size="14" fill="#64748B">142</text>
  <text x="600" y="195" font-family="Arial" font-size="14" fill="#64748B">Oct 24, 2023</text>

  <!-- Row 2 -->
  <rect x="40" y="230" width="720" height="60" rx="4" fill="white" stroke="#E2E8F0" />
  <rect x="60" y="250" width="20" height="20" rx="4" fill="#3B82F6" opacity="0.2" /> <!-- DOC Icon -->
  <text x="90" y="265" font-family="Arial" font-size="14" fill="#334155">Project_Specs_v2.docx</text>
  <rect x="300" y="250" width="80" height="24" rx="12" fill="#DBEAFE" />
  <text x="340" y="266" font-family="Arial" font-size="12" fill="#1E40AF" text-anchor="middle">Processing</text>
  <rect x="450" y="258" width="60" height="8" rx="4" fill="#E2E8F0">
    <rect x="450" y="258" width="40" height="8" rx="4" fill="#3B82F6" />
  </rect>
  <text x="600" y="265" font-family="Arial" font-size="14" fill="#64748B">Just now</text>

  <!-- Row 3 -->
  <rect x="40" y="300" width="720" height="60" rx="4" fill="white" stroke="#E2E8F0" />
  <rect x="60" y="320" width="20" height="20" rx="4" fill="#F59E0B" opacity="0.2" /> <!-- TXT Icon -->
  <text x="90" y="335" font-family="Arial" font-size="14" fill="#334155">meeting_notes.txt</text>
  <rect x="300" y="320" width="80" height="24" rx="12" fill="#DCFCE7" />
  <text x="340" y="336" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle">Indexed</text>
  <text x="450" y="335" font-family="Arial" font-size="14" fill="#64748B">15</text>
  <text x="600" y="335" font-family="Arial" font-size="14" fill="#64748B">Oct 22, 2023</text>
  
  <!-- Pagination -->
  <rect x="640" y="540" width="120" height="30" rx="4" fill="white" stroke="#E2E8F0" />
  <text x="700" y="560" font-family="Arial" font-size="14" fill="#64748B" text-anchor="middle">Page 1 of 5</text>
</svg>